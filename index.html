<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProcessTracer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Cleanroom process traveler. Your data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ProcessTracer</title>
<style>
:root {
  --font: "Helvetica Neue", Helvetica, "TeX Gyre Heros", Arial, "Liberation Sans", sans-serif;
  --paper: #F3F5F8; --surface: #FFFFFF; --surface-2: #EBEEF3;
  --ink: #172029; --ink-2: #46515F; --ink-3: #5F6A78;
  --rule: #D9DEE5; --rule-2: #BAC2CD;
  --accent: #33449A; --accent-2: #E6E9F6; --accent-ink: #FFFFFF; --stamp: #33449A; --focus: #33449A;
  --run: #E2AD35; --run-ink: #3B2A00; --run-text: #7A5300; --run-tint: #FAF0D7;
  --danger: #B42318; --danger-solid: #B42318; --danger-tint: #FBE9E7;
  --neutral: #7F8C8D; --marker-fill: #FFFFFF;
  --k-clean: #7F8C8D; --k-litho: #E2AD35; --k-etch: #B43875; --k-dep: #6E8BD7;
  --k-thermal: #D46927; --k-metrology: #7463C6; --k-other: #9AA3AE;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141A; --surface: #171D25; --surface-2: #202832;
    --ink: #E6EBF1; --ink-2: #B4BECA; --ink-3: #95A0AD;
    --rule: #2B3440; --rule-2: #435061;
    --accent: #A3B3F4; --accent-2: #232C47; --accent-ink: #0F141A; --stamp: #A3B3F4; --focus: #A3B3F4;
    --run: #E2AD35; --run-ink: #2A1E00; --run-text: #EDC260; --run-tint: #362C12;
    --danger: #F2968D; --danger-solid: #C2372C; --danger-tint: #3B1F1C;
    --neutral: #97A3A4; --marker-fill: #171D25; --k-other: #A7B0BB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141A; --surface: #171D25; --surface-2: #202832;
  --ink: #E6EBF1; --ink-2: #B4BECA; --ink-3: #95A0AD;
  --rule: #2B3440; --rule-2: #435061;
  --accent: #A3B3F4; --accent-2: #232C47; --accent-ink: #0F141A; --stamp: #A3B3F4; --focus: #A3B3F4;
  --run: #E2AD35; --run-ink: #2A1E00; --run-text: #EDC260; --run-tint: #362C12;
  --danger: #F2968D; --danger-solid: #C2372C; --danger-tint: #3B1F1C;
  --neutral: #97A3A4; --marker-fill: #171D25; --k-other: #A7B0BB;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  min-height: 100%; margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
:where(button) { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:where(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea) {
  font: inherit; font-size: 16px; color: var(--ink); background-color: var(--surface);
  border: 1px solid var(--rule-2); border-radius: 9px; padding: 9px 11px; min-height: 44px; width: 100%; min-width: 0;
}
:where(textarea) { resize: vertical; line-height: 1.4; display: block; }
:where(select) {
  appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
:where(input, select, textarea):focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
::placeholder { color: var(--ink-3); opacity: .8; }
input[type="checkbox"] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 750; }
h2 { font-size: 17px; line-height: 1.3; margin: 0; font-weight: 700; }
p { margin: 0; }
section { margin-top: 24px; }

/* ---------- header and tabs ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 16px; min-height: 52px; }
.brand { border: 0; background: none; padding: 6px 0; font-size: 17px; font-weight: 750; letter-spacing: -0.01em; color: var(--ink); cursor: pointer; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex;
  background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1 1 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 58px; border: 0; background: none; color: var(--ink-3); font-size: 12px; font-weight: 600; cursor: pointer;
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.grow { flex: 1 1 auto; }
.save-state { font-size: 13px; color: var(--ink-3); white-space: nowrap; border: 0; background: none; padding: 4px 6px; }
.save-state.warn { color: var(--run-text); font-weight: 650; }
.save-state.err { color: var(--danger); font-weight: 700; cursor: pointer; text-decoration: underline; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.on { color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(100px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
.banner { width: calc(100% - 32px); max-width: 728px; margin: 10px auto 0; padding: 10px 14px; border-radius: 10px; background: var(--run-tint); font-size: 14px; }
.banner.err { background: var(--danger-tint); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
@media (min-width: 820px) {
  .tabbar { position: static; margin-left: 18px; gap: 2px; background: none; border: 0; padding: 0; }
  .tab { flex: none; flex-direction: row; gap: 7px; min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 9px; }
  .tab .i { width: 19px; height: 19px; }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab[aria-current="page"] { background: var(--surface-2); }
  .tab[aria-current="page"]::before { display: none; }
  main { padding-bottom: 64px; }
}

/* ---------- generic ---------- */
.row { display: flex; align-items: center; }
.gap { gap: 8px; }
.wrap { flex-wrap: wrap; }
.end { justify-content: flex-end; }
.center { justify-content: center; margin-top: 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.pad { padding: 18px 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.sep { height: 1px; background: var(--rule); margin: 6px 0; }
.lede { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; max-width: 64ch; }
.warn { color: var(--danger); font-size: 14px; }
.caution { color: var(--run-text); font-size: 14px; }
.small.caution, .caution.small { font-size: 13px; }
.glyph, .i { display: block; flex: none; overflow: visible; }
.chip { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.vh { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
.page-head h1 { margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 2px 0 8px; }
.search {
  display: flex; align-items: center; gap: 4px; flex: 1 1 200px; min-width: 0; padding-left: 10px;
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: 10px; color: var(--ink-3);
}
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search input { border: 0; background: transparent; padding-left: 2px; }
.search input:focus { outline: none; }
.narrow { width: auto; max-width: 100%; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px 2px; max-width: 58ch; }
.empty-title { font-size: 18px; font-weight: 700; }
.empty p { color: var(--ink-2); }
.loading { padding: 12px 0; }
.skel { height: 66px; border-radius: 10px; background: var(--surface-2); margin: 10px 0; }
.crash { max-width: 560px; margin: 48px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* ---------- buttons and inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 15px;
  border: 1px solid var(--rule-2); border-radius: 10px; background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 600; line-height: 1.1; white-space: nowrap; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.run { background: var(--run); border-color: var(--run); color: var(--run-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
.btn.sm { min-height: 38px; padding: 0 11px; font-size: 14px; border-radius: 9px; }
.btn.sm .i { width: 18px; height: 18px; }
.btn.xs { min-height: 34px; padding: 0 9px; font-size: 13px; }
label.btn { position: relative; }
.backlink {
  display: inline-flex; align-items: center; gap: 2px; min-height: 40px; margin: 0 0 4px -8px; padding: 0 10px 0 2px;
  border: 0; border-radius: 8px; background: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer;
}
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.linkish.block { display: block; text-align: left; padding: 1px 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lab { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.field .hint { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.short { max-width: 220px; }
.check { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 14px; line-height: 1.38; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: 1px; }
.check.inline { padding: 0; align-items: center; }
.seg { display: inline-flex; gap: 2px; max-width: 100%; overflow-x: auto; padding: 3px; border-radius: 10px; background: var(--surface-2); }
.seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10, 14, 20, .14); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--rule-2);
  border-radius: 18px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 550; cursor: pointer;
}
.chip-btn:hover { border-color: var(--ink-3); }
.chip-btn.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.unit-in { display: flex; }
.unit-in input { flex: 1 1 auto; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.unit-in select { flex: none; width: auto; border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; background-color: var(--surface-2); }

/* ---------- samples list ---------- */
.samples { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.sample-row {
  display: flex; flex-direction: column; gap: 5px; width: 100%; padding: 14px 6px; border: 0; border-bottom: 1px solid var(--rule);
  background: none; text-align: left; color: inherit; cursor: pointer;
}
.sample-row:hover { background: var(--surface); }
.sr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sr-name { font-size: 21px; font-weight: 750; letter-spacing: -0.015em; word-break: break-word; }
.tpl-name { font-size: 18px; letter-spacing: -0.01em; }
.sr-ago { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.sr-desc { font-size: 15px; color: var(--ink-2); }
.sr-strip { display: flex; align-items: center; gap: 10px; margin-top: 3px; }
.sr-count { font-size: 13px; color: var(--ink-3); }
.sr-next { font-size: 14px; color: var(--ink-2); }
.run-dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--run); vertical-align: 1px; }
.strip { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.cell { display: block; width: 7px; height: 15px; border-radius: 2px; border: 1.5px solid var(--rule-2); background: var(--surface); }
.cell.done { background: var(--c); border-color: var(--c); }
.cell.running { background: var(--run); border-color: var(--run); }
.cell.skipped { background: repeating-linear-gradient(135deg, var(--rule-2) 0 1.5px, transparent 1.5px 4px); }
.cell.kind { border-color: var(--c); background: var(--surface); box-shadow: inset 0 -6px 0 var(--c); }

/* ---------- traveler ---------- */
.sample-head { margin: 2px 0 4px; }
.sh-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sample-id { margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; word-break: break-word; }
.sh-desc { margin-top: 6px; font-size: 16px; color: var(--ink-2); max-width: 62ch; }
.sh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; margin-top: 8px; font-size: 13px; color: var(--ink-3); }
.callout { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-2); }
.steps { list-style: none; margin: 16px 0 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px 24px minmax(0, 1fr) auto; column-gap: 8px; align-items: start; padding: 6px 0; }
.step::before { content: ""; position: absolute; left: 43.25px; top: 0; bottom: 0; width: 1.5px; background: var(--rule-2); }
.step:first-child::before { top: 24px; }
.step:last-child::before { bottom: auto; height: 24px; }
.step:only-child::before { display: none; }
.step.done::before { background: var(--stamp); opacity: .5; }
.st-num { grid-column: 1; padding-top: 14px; text-align: right; font-size: 13px; color: var(--ink-3); }
.st-node { grid-column: 2; position: relative; z-index: 1; display: flex; justify-content: center; padding-top: 14px; }
.st-toggle {
  grid-column: 3; display: flex; flex-direction: column; gap: 2px; min-height: 48px; padding: 10px 0; border: 0;
  background: none; text-align: left; color: inherit; cursor: pointer; min-width: 0;
}
.st-name { font-size: 16px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.step.next .st-name { font-weight: 750; }
.step.skipped .st-name { color: var(--ink-3); text-decoration: line-through; }
.st-sub { font-size: 14px; color: var(--ink-2); word-break: break-word; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-3); }
.st-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 1.5; }
.badge.rate { color: var(--ink); font-variant-numeric: tabular-nums; }
.badge.excl { color: var(--ink-3); text-decoration: line-through; }
.tag { padding: 1px 6px; border-radius: 5px; background: var(--run-tint); color: var(--run-text); font-size: 12px; font-weight: 650; vertical-align: 2px; }
.st-act { grid-column: 4; display: flex; align-items: center; justify-content: flex-end; min-height: 48px; padding-top: 4px; }
.run-act { display: flex; align-items: center; gap: 8px; }
.run-chip { padding: 4px 8px; border-radius: 7px; background: var(--run-tint); color: var(--run-text); font-size: 14px; font-weight: 700; }
.skip-label { padding: 0 4px; color: var(--ink-3); font-size: 13px; }
.stamp {
  display: inline-flex; flex-direction: column; align-items: center; margin: 2px 4px 2px 0; padding: 3px 7px;
  border: 2px solid var(--stamp); border-radius: 6px; color: var(--stamp); line-height: 1.12;
  transform: rotate(-5deg); font-variant-numeric: tabular-nums;
}
.stamp b { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.stamp span { font-size: 12px; font-weight: 600; }
.stamp.fresh { animation: thunk .42s cubic-bezier(.2, 1.5, .35, 1) both; }
@keyframes thunk { 0% { transform: rotate(-16deg) scale(1.8); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotate(-5deg) scale(1); opacity: 1; } }
.st-detail {
  grid-column: 3 / 5; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 16px; margin: 2px 0 10px; padding: 14px;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--surface);
}
.status-panel { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.status-panel.running b { color: var(--run-text); }
.sel-glyph { display: flex; align-items: center; gap: 8px; }
.sel-glyph select { flex: 1; }
.rate-block { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.rate-block .unit-in select { background-color: var(--paper); }
.rate-inputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.rate-out { display: flex; flex-direction: column; gap: 6px; }
.rate-val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.big { font-size: 28px; font-weight: 750; letter-spacing: -0.01em; }
.cmp { color: var(--ink-2); line-height: 1.45; }
.stopwatch { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.sw-time { min-width: 78px; font-size: 20px; font-weight: 700; }
.stopwatch.on .sw-time { color: var(--run-text); }
.meas { display: flex; flex-direction: column; gap: 8px; }
.meas-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, .8fr) 40px; gap: 6px; align-items: center; }
.meas-row .icon-btn { width: 40px; }
.photos { display: flex; flex-direction: column; gap: 8px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.thumb { position: relative; display: block; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface-2); cursor: pointer; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb .cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 4px; overflow: hidden; color: #fff; font-size: 12px;
  text-align: left; white-space: nowrap; text-overflow: ellipsis; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .68));
}
.thumb.loading { display: flex; align-items: center; justify-content: center; cursor: default; }
.file-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 100%; color: var(--ink-2); font-size: 12px; font-weight: 700; }
.spinner { width: 22px; height: 22px; border: 2.5px solid var(--rule-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.st-foot { display: flex; flex-wrap: wrap; gap: 2px; padding-top: 10px; border-top: 1px solid var(--rule); }
.after-steps { margin-top: 16px; }
@media (max-width: 560px) {
  .st-detail .grid2 { grid-template-columns: minmax(0, 1fr); }
  .st-detail { padding: 12px; margin-left: -32px; }
  .sample-id { font-size: 32px; }
}

/* ---------- sheets, menus, toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 12, 18, .5); animation: fade .15s ease-out; }
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100% - 20px - env(safe-area-inset-top, 0px)); overflow: auto;
  padding: 0 18px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 16px 16px 0 0; background: var(--surface);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); outline: none; animation: rise .22s cubic-bezier(.2, .9, .3, 1);
}
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; background: var(--surface); }
.sheet-head h2 { font-size: 19px; }
.sheet-head .icon-btn { margin-right: -10px; }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) {
  .scrim { align-items: center; padding: 20px; }
  .sheet { border-radius: 16px; max-height: calc(100% - 40px); padding-bottom: 22px; }
}
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
.menu { display: flex; flex-direction: column; }
.menu button {
  display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--rule);
  background: none; color: var(--ink); font-size: 16px; text-align: left; cursor: pointer;
}
.menu button:last-child { border-bottom: 0; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.lib { display: flex; flex-direction: column; gap: 12px; }
.lib-group { display: flex; flex-direction: column; gap: 6px; }
.lib-head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.pick-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.check.pick { padding: 10px 0; border-bottom: 1px solid var(--rule); color: var(--ink); }
.check.pick > span { display: flex; flex-direction: column; gap: 2px; }
.mono-area { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.toasts {
  position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 12px; max-width: 520px; padding: 8px 8px 8px 16px; border-radius: 12px;
  background: var(--ink); color: var(--paper); font-size: 15px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  pointer-events: auto; animation: rise .2s cubic-bezier(.2, .9, .3, 1);
}
.toast > span { padding: 4px 0; }
.toasts.top { top: calc(58px + env(safe-area-inset-top, 0px)); bottom: auto; }
.lightbox .toast, .toasts.top .toast { border: 1px solid rgba(255, 255, 255, .16); }
.lightbox :focus-visible, .lightbox .lb-cap:focus { outline-color: #A3B3F4; border-color: #A3B3F4; }
.toast.err { background: var(--danger-solid); color: #fff; }
.toast-act { min-height: 38px; padding: 0 10px; border: 0; background: none; color: inherit; font-weight: 750; text-decoration: underline; cursor: pointer; }
@media (min-width: 820px) { .toasts { bottom: 24px; } }

/* ---------- photo viewer ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; background: #0B0E12; color: #fff;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.lb-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 16px; }
.lb-title { overflow: hidden; color: #D6DBE2; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }
.lb-count { margin-left: 10px; color: #98A2AF; }
.lb-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 48px; height: 64px; border: 0; border-radius: 10px; background: rgba(0, 0, 0, .45); color: #fff; cursor: pointer; }
.lb-nav.prev { left: 6px; }
.lb-nav.next { right: 6px; }
.lb-file { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #D6DBE2; }
.lb-bar { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; background: #12161C; }
.lb-cap { background-color: #1C222B; border-color: #313B48; color: #fff; }
.lb-when { color: #A8B1BD; }
.icon-btn.light { color: #fff; }
.icon-btn.light:hover { background: rgba(255, 255, 255, .1); }
.lightbox .btn { background: #1C222B; border-color: #313B48; color: #fff; }
.lightbox .btn.danger { color: #FF9C92; }

/* ---------- log ---------- */
.log-tools { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
.log-tools > * { min-width: 0; }
.log-filter .search { flex: 1 1 140px; }
@media (max-width: 640px) {
  .log-tools .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
  .log-tools .chips::-webkit-scrollbar { display: none; }
  .log-tools .chip-btn { flex: none; }
}
.day { margin-top: 18px; }
.day-head { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 2; padding: 8px 0 6px; border-bottom: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); font-size: 14px; }
.events { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 66px 22px minmax(0, 1fr); gap: 8px; align-items: start; border-bottom: 1px solid var(--rule); }
.ev-t { padding-top: 13px; text-align: right; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.ev-g { display: flex; justify-content: center; padding-top: 12px; color: var(--ink-3); }
.ev-main { display: flex; flex-direction: column; gap: 3px; min-height: 48px; min-width: 0; padding: 10px 4px; border: 0; background: none; text-align: left; color: inherit; cursor: pointer; }
.ev-main:hover .ev-title { text-decoration: underline; text-decoration-color: var(--rule-2); }
.ev-title { font-size: 15px; font-weight: 600; word-break: break-word; }
.ev-sample { margin-left: 3px; color: var(--accent); font-weight: 700; }
.ev-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.ev.running .ev-title { color: var(--run-text); }
.ev.skipped .ev-title { color: var(--ink-3); }

/* ---------- rates ---------- */
.groups { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.group-row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; width: 100%;
  padding: 12px 4px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; color: inherit; cursor: pointer;
}
.group-row:hover { background: var(--surface); }
.gr-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gr-title { font-size: 17px; font-weight: 700; }
.gr-sub { overflow: hidden; color: var(--ink-2); font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }
.gr-meta { color: var(--ink-3); }
.gr-num { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; }
.big2 { font-size: 21px; font-weight: 750; }
.spark { display: block; }
.spark-empty { display: block; width: 72px; }
@media (max-width: 480px) {
  .gr-spark { display: none; }
  .group-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
}
.group-head h1 { margin: 0; }
.group-head .sh-desc { margin-top: 4px; }
.statgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; margin: 16px 0 8px; overflow: hidden; border: 1px solid var(--rule); border-radius: 12px; background: var(--rule); }
.stat { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; background: var(--surface); }
.stat.wide { grid-column: 1 / -1; }
.stat-lab { color: var(--ink-2); font-size: 13px; font-weight: 650; }
.stat-val { font-size: 27px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.15; }
.stat-val.small-val { font-size: 17px; }
.pm { color: var(--ink-2); font-size: 16px; font-weight: 600; }
.stat-sub { color: var(--ink-2); font-size: 13px; line-height: 1.4; }
.calc { padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
.calc h2 { margin-bottom: 10px; }
.calc-row { align-items: center; }
.calc-in { width: 210px; max-width: 100%; }
.calc-out { display: flex; flex-direction: column; gap: 2px; }
.calc-out b { font-size: 22px; }
.calc .warn { margin-top: 8px; }
.chart-tools { margin-bottom: 8px; }
.chart-box { width: 100%; max-width: 500px; }
.chart { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 12px; fill: var(--ink); }
.chart text.ax { font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.table-wrap { position: relative; margin-top: 10px; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
table.runs { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px; }
.runs th, .runs td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.runs th { background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; white-space: nowrap; }
.runs .num { text-align: right; }
.runs tr:last-child td { border-bottom: 0; }
.runs tr.excl td { color: var(--ink-3); }
.runs tr.excl td b { text-decoration: line-through; }
.runs tr.has-note td { border-bottom: 0; padding-bottom: 2px; }
.runs tr.note-row td { padding-top: 0; font-size: 13px; }
.runs td.act { text-align: right; }

/* ---------- templates, import, settings ---------- */
.tpl-head { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 12px; }
.title-input { padding-left: 4px; border-color: transparent; background-color: transparent; font-size: 26px; font-weight: 750; letter-spacing: -0.02em; }
.title-input:hover { border-color: var(--rule-2); }
textarea.paste { min-height: 220px; margin-bottom: 12px; font-size: 14px; line-height: 1.45; }
.import-list { list-style: none; margin: 12px 0; padding: 0; border-top: 1px solid var(--rule); }
.import-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.import-list li.off { opacity: .5; }
.import-list li > input { margin-top: 12px; }
.imp-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.imp-name { flex: 1; }
.imp-params { color: var(--ink-2); white-space: pre-wrap; }
.sticky-actions { position: sticky; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); padding: 10px 0; background: var(--paper); }
@media (min-width: 820px) { .sticky-actions { bottom: 0; } }
.set-group { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.set-group:last-child { border-bottom: 0; }
@media (prefers-reduced-motion: reduce) {
  .stamp.fresh, .scrim, .sheet, .toast { animation: none; }
  .spinner { animation-duration: 2.4s; }
}

/* ---------- on-device version ---------- */
.banner.act { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.banner.act > span { flex: 1 1 240px; }
.file-tile.missing span { padding: 0 6px; text-align: center; font-weight: 600; line-height: 1.25; }
.lb-file span { max-width: 34ch; text-align: center; }
.merge-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.merge-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.folder-box { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }

</style>

      let g = groups.get(k);
      if (!g) groups.set(k, g = { key: k, kind: row.kind, basis: row.basis, rows: [], last: 0 });
      g.rows.push(row);
      if (row.at >= g.last) {

        Object.assign(g, { method: row.method, material: row.material, tool: row.tool, recipe: row.recipe });
      }
    }

    for (const t of Object.values(view('templates'))) (t.steps || []).forEach(add);

const blobLoads = new Set(), blobMissing = new Set();
function imgSrc(im) {

  if (u || !LOCAL) return u || ('/_blob/' + im.id);
  const a = store.caps.assets;
  if (store.mode === 'db' && a && a.get && !blobLoads.has(im.id) && !blobMissing.has(im.id)) {

      .then(() => { blobLoads.delete(im.id); bump(); });

const photoMissing = id => LOCAL && blobMissing.has(id);
function loadImg(file) {
  return new Promise((res, rej) => {
    const im = new Image();
    const url = URL.createObjectURL(file);
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => {
      URL.revokeObjectURL(url);
      const fr = new FileReader();
      fr.onload = () => { const im2 = new Image(); im2.onload = () => res(im2); im2.onerror = () => rej(new Error('decode')); im2.src = fr.result; };
      fr.onerror = () => rej(new Error('read'));
      fr.readAsDataURL(file);
    };
    im.src = url;
  });
}
async function shrinkImage(img, maxDim, quality = 0.88) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const k = maxDim ? Math.min(1, maxDim / Math.max(w0, h0)) : 1;
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  return { blob, canvas: c };
}
async function prepImage(file, maxDim) {
  const type = (file.type || '').toLowerCase();
  if (type === 'application/pdf') return { blob: file, type };
  if (type === 'image/gif' || (!maxDim && OK_IMG.includes(type))) return { blob: file, type };
  let img;
  try { img = await loadImg(file); } catch (e) {
    if (OK_IMG.includes(type)) return { blob: file, type };
    throw { code: 'decode' };
  }
  const big = Math.max(img.naturalWidth, img.naturalHeight);
  if (OK_IMG.includes(type) && big <= maxDim && file.size < 4e6) return { blob: file, type };
  const { blob } = await shrinkImage(img, maxDim);
  if (!blob) { if (OK_IMG.includes(type)) return { blob: file, type }; throw { code: 'decode' }; }
  return { blob, type: 'image/jpeg' };
}
function uploadErrText(e) {
  const c = e && e.code;
  if (c === 'decode') return 'That file is not an image this browser can read. Use JPEG or PNG.';
  if (c === 'too_large') return 'That file is over the 20 MB limit.';
  if (c === 'unsupported_type') return 'Only images and PDFs can be attached.';
  if (c === 'quota_or_state') return 'Photo storage is full. Delete unused photos and try again.';
  if (c === 'rate_limited') return 'Too many uploads at once. Try again in a moment.';
  return 'Could not upload that photo. Try again.';
}
async function addFiles(sid, stepId, files) {

function imageRefCount(id, except) {

async function blobOf(im) {

function guessKind(t) {
  t = String(t || '').toLowerCase();
  if (/\bstrip/.test(t) && !/lift-?off/.test(t)) return 'clean';
  if (/(lift-?off|resist|spin|coat|expos|mla|develop|hmds|photo|litho)/.test(t)) return 'litho';
  if (/(etch|icp|rie\b|mesa|recess|descum|bcl3|cl2|koh|tmah|\bboe\b)/.test(t)) return 'etch';
  if (/(depos|sputter|pecvd|\bald\b|e-?beam|evap|mocvd|\bmbe\b|regrow|metali[sz])/.test(t)) return 'dep';
  if (/(anneal|\brta\b|furnace|bake)/.test(t)) return 'thermal';
  if (/(clean|solvent|acetone|\bipa\b|rinse|\bdip\b|\bhcl\b|\bhf\b|piranha|strip|dehydrat)/.test(t)) return 'clean';
  if (/(measure|\bafm\b|\bsem\b|dektak|profil|ellips|inspect|microscope|\btlm\b|\bhall\b|test|\biv\b|\bcv\b)/.test(t)) return 'metrology';
  return 'other';
}
function parseLines(text) {
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const parts = (l.includes('\t') ? l.split('\t') : l.split('|')).map(p => p.trim());
    const [name = '', tool = '', recipe = '', ...rest] = parts;
    return { name, tool, recipe, params: rest.filter(Boolean).join('; '), method: '', material: '', kind: guessKind(parts.join(' ')) };
  }).filter(x => x.name);
}
function cleanAiSteps(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(x => x && typeof x === 'object').map(x => {
    const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v)).trim().slice(0, 2000);
    const name = str(x.name);
    const kind = KINDS[str(x.kind)] ? str(x.kind) : guessKind(name + ' ' + str(x.tool));
    return { name, kind, tool: str(x.tool), recipe: str(x.recipe), method: isRateKind(kind) ? str(x.method) : '',
      material: isRateKind(kind) ? str(x.material) : '', params: str(x.params) };
  }).filter(x => x.name);
}
function aiPrompt(text) {
  return `Convert this semiconductor cleanroom process traveler into structured steps for a tracking app.

Reply with only a JSON array, no other text. One object per process step, in the original order, with exactly these string fields:
"name": short step title; "kind": one of "clean", "litho", "etch", "dep", "thermal", "metrology", "other"; "tool": equipment name or ""; "recipe": recipe name or chemistry or ""; "method": for etch or dep only, such as "ICP-RIE", "Wet", "Sputter", "PECVD", "ALD", "E-beam", otherwise ""; "material": material etched or deposited, otherwise ""; "params": the conditions exactly as written (times, temperatures, spin speeds, doses, gas flows, target thicknesses), joined with "; ".

Format example (not data): [{"name":"Mesa isolation","kind":"etch","tool":"ICP","recipe":"BCl3/Cl2","method":"ICP-RIE","material":"GaN","params":"target 200 nm"}]

Traveler:
"""
${String(text).slice(0, 60000)}
"""`;

function completeStep(sid, st) {

    x.by = initials() || x.by || '';

      x.sw = { since: null, acc: (x.sw.acc || 0) + (now - x.sw.since) };
      if (!x.timeV && x.timeU !== 'cyc') x.timeV = swToField(x.sw.acc, x.timeU);

  setTimeout(() => ui.fresh.delete(st.id), 1500);

function openNewSample(preset = {}) { openSheet(() => html`<${NewSampleSheet} ...${preset} />`); }
function copySteps(srcId, keep) {

  if (steps.some(st => st.status === 'done' && !st.run)) {
    const upd = updSample(srcId, s => { for (const st of s.steps || []) if (st.status === 'done' && !st.run) st.run = newId('r'); });
    steps = upd.steps;
  }

}
function NewSampleSheet({ tplId = '' }) {

  const [keep, setKeep] = useState(false);

  const opts = [['blank', 'Blank']];

function Stopwatch({ sid, st }) {

  const ms = (sw.acc || 0) + (running ? Date.now() - sw.since : 0);
  const start = () => updStep(sid, st.id, x => { x.sw = { since: Date.now(), acc: (x.sw && x.sw.acc) || 0 }; });
  const stop = () => updStep(sid, st.id, x => {
    const now = Date.now();
    const acc = ((x.sw && x.sw.acc) || 0) + (x.sw && x.sw.since ? now - x.sw.since : 0);
    x.sw = { since: null, acc };
    x.timeV = swToField(acc, x.timeU);
  });
  return html`<div class=${'stopwatch' + (running ? ' on' : '')}>

  </div>`;
}

/* ---------------- photo viewer ---------------- */
function openLightbox(sid, stepId, index) { ui.lightbox = { sid, stepId, index }; bump(); }
function Lightbox() {
  const lb = ui.lightbox;
  const s = view('samples')[lb.sid];
  const st = s && (s.steps || []).find(x => x.id === lb.stepId);
  const imgs = (st && st.imgs) || [];
  const touch = useRef(null);
  const close = () => { ui.lightbox = null; bump(); };
  const i = Math.max(0, Math.min(lb.index, imgs.length - 1));
  const move = d => { ui.lightbox = { ...lb, index: (i + d + imgs.length) % imgs.length }; bump(); };
  useEffect(() => {
    const k = e => {
      if (ui.sheet) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft' && imgs.length > 1) move(-1);
      else if (e.key === 'ArrowRight' && imgs.length > 1) move(1);
    };
    addEventListener('keydown', k);
    return () => removeEventListener('keydown', k);
  });
  useEffect(() => { if (!imgs.length) close(); }, [imgs.length]);
  if (!imgs.length) return null;
  const im = imgs[i];
  const isImg = (im.type || 'image/').startsWith('image/');
  const stepNo = s.steps.findIndex(x => x.id === st.id) + 1;
  const del = async () => {
    if (!(await confirmBox({ title: isImg ? 'Delete this photo?' : 'Delete this file?', body: 'It will be removed from this step. This cannot be undone.', ok: 'Delete', danger: true }))) return;
    const id = im.id;
    updStep(lb.sid, lb.stepId, x => { x.imgs = (x.imgs || []).filter(y => y.id !== id); });
    deleteAssetIfUnused(id);
    if (imgs.length > 1) { ui.lightbox = { ...lb, index: Math.max(0, i - 1) }; bump(); }
  };
  const save = async () => {
    try {
      const b = await blobOf(im);
      const ext = { 'application/pdf': 'pdf', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' }[im.type] || 'jpg';
      await saveFile(`${safeName(s.name)}_step${stepNo}_${safeName(st.name)}_${i + 1}.${ext}`, b);
    } catch (e) { toast('Could not load that file for saving.', { error: true }); }
  };
  return html`<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top"><span class="lb-title">${s.name}, step ${stepNo} ${st.name ? `(${st.name})` : ''}<span class="lb-count">${i + 1} of ${imgs.length}</span></span>
      <button class="icon-btn light" aria-label="Close" onClick=${close}>${I.x()}</button></div>
    <div class="lb-stage" onTouchStart=${e => { touch.current = e.touches[0].clientX; }}
      onTouchEnd=${e => { if (touch.current == null || imgs.length < 2) return; const dx = e.changedTouches[0].clientX - touch.current; touch.current = null; if (Math.abs(dx) > 50) move(dx < 0 ? 1 : -1); }}>
      ${imgs.length > 1 ? html`<button class="lb-nav prev" aria-label="Previous" onClick=${() => move(-1)}>${I.left()}</button>` : null}
      ${!isImg ? html`<div class="lb-file">${I.file()}<span>${im.name || 'PDF attachment'}</span></div>`
        : imgSrc(im) ? html`<img src=${imgSrc(im)} alt=${im.cap || 'Step photo'} />`
        : photoMissing(im.id) ? html`<div class="lb-file">${I.image()}<span>This photo is not stored on this device. Import a backup that includes it.</span></div>`
        : html`<span class="spinner" />`}
      ${imgs.length > 1 ? html`<button class="lb-nav next" aria-label="Next" onClick=${() => move(1)}>${I.right()}</button>` : null}
    </div>
    <div class="lb-bar">
      <input class="lb-cap" aria-label="Caption" placeholder="Add a caption" value=${im.cap || ''}
        onInput=${e => { const v = e.currentTarget.value, id = im.id; updStep(lb.sid, lb.stepId, x => { const t = (x.imgs || []).find(y => y.id === id); if (t) t.cap = v; }, 700); }} />
      <div class="row gap wrap lb-actions"><span class="small lb-when">Added ${fmtDT(im.at)}</span><span class="grow" />
        ${store.caps.downloads ? html`<button class="btn sm" onClick=${save}>${I.download()}<span>Save</span></button>` : null}
        <button class="btn sm danger" onClick=${del}>${I.trash()}<span>Delete</span></button></div>
    </div></div>`;
}

function openTimeEdit(sid, st) { openSheet(() => html`<${TimeEditSheet} sid=${sid} st=${st} />`); }
function TimeEditSheet({ sid, st }) {
  const isDone = st.status === 'done';
  const [a, setA] = useState(st.startedAt ? toLocalInput(st.startedAt) : '');
  const [b, setB] = useState(st.doneAt ? toLocalInput(st.doneAt) : '');
  const ta = fromLocalInput(a), tb = fromLocalInput(b);
  let warn = '', block = false;
  if (isDone && !tb) { warn = 'Enter a completion time.'; block = true; }
  else if (ta && tb && tb < ta) { warn = 'Completion is earlier than the start. Check both times.'; block = true; }
  else if ((tb && tb > Date.now() + 60000) || (ta && ta > Date.now() + 60000)) warn = 'This time is in the future.';
  if (st.status === 'running' && !ta) { warn = 'A running step needs a start time.'; block = true; }
  const save = () => {
    updStep(sid, st.id, x => {
      x.startedAt = ta || null;
      if (isDone) { if (tb !== x.doneAt) x.timeEdited = true; x.doneAt = tb; }
    });
    closeSheet();
    toast('Times updated');
  };
  return html`<${Sheet} title="Change times" onClose=${closeSheet}>
    <p class="lede">For steps you log after leaving the bay. The time you first marked it done stays on record.</p>
    <div class="stack">
      <${Field} label="Started"><input type="datetime-local" value=${a} onInput=${e => setA(e.currentTarget.value)} onChange=${e => setA(e.currentTarget.value)} /></${Field}>
      ${isDone ? html`<${Field} label="Completed"><input type="datetime-local" value=${b} onInput=${e => setB(e.currentTarget.value)} onChange=${e => setB(e.currentTarget.value)} /></${Field}>` : null}
      ${warn ? html`<p class=${block ? 'warn' : 'caution'}>${warn}</p>` : null}
      <div class="row end gap"><button class="btn" onClick=${closeSheet}>Cancel</button>
        <button class="btn primary" disabled=${block} onClick=${save}>Save times</button></div>
    </div></${Sheet}>`;
}

function openCopyResult(sid, st) { openSheet(() => html`<${CopyResultSheet} sid=${sid} st=${st} />`); }
function CopyResultSheet({ sid, st }) {
  const cands = Object.entries(view('samples')).filter(([id, s]) => id !== sid && (s.status || 'active') === 'active').map(([id, s]) => {
    const i = (s.steps || []).findIndex(x => norm(x.name) === norm(st.name) && x.status !== 'done');
    return i >= 0 ? { id, s, i, t: s.steps[i] } : null;
  }).filter(Boolean);
  const [sel, setSel] = useState(() => new Set());
  const [notes, setNotes] = useState(true);
  const [photos, setPhotos] = useState(true);
  const flip = id => setSel(o => { const n = new Set(o); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  const apply = () => {
    let run = st.run;
    if (!run) { run = newId('r'); updStep(sid, st.id, x => { x.run = run; }); }
    for (const c of cands) {
      if (!sel.has(c.id)) continue;
      updStep(c.id, c.t.id, x => {
        Object.assign(x, { status: 'done', doneAt: st.doneAt, startedAt: st.startedAt, loggedAt: Date.now(), timeEdited: !!st.timeEdited,
          skippedAt: null, by: st.by, tool: st.tool, recipe: st.recipe, method: st.method, material: st.material,
          params: st.params || x.params, timeV: st.timeV, timeU: st.timeU, thkV: st.thkV, thkU: st.thkU,
          meas: clone(st.meas || []), run, excl: !!st.excl, exclWhy: st.exclWhy || '' });
        if (notes && st.notes) x.notes = x.notes ? `${x.notes}\n${st.notes}` : st.notes;
        if (photos && (st.imgs || []).length) x.imgs = [...(x.imgs || []), ...clone(st.imgs).filter(im => !(x.imgs || []).some(y => y.id === im.id))];
      });
    }
    closeSheet();
    toast(`Applied to ${plural(sel.size, 'sample')}`);
  };
  return html`<${Sheet} title="Apply to other samples" onClose=${closeSheet}>
    <p class="lede">For samples processed in the same run. They get this step's completion time, data and conditions, and the rate history counts the run once.</p>
    ${cands.length ? html`<div class="stack">
      <div class="pick-list">${cands.map(c => html`<label class="check pick" key=${c.id}><input type="checkbox" checked=${sel.has(c.id)} onChange=${() => flip(c.id)} />
        <span><b>${c.s.name}</b><span class="muted small">Step ${c.i + 1}: ${c.t.name}</span></span></label>`)}</div>
      ${st.notes ? html`<label class="check"><input type="checkbox" checked=${notes} onChange=${e => setNotes(e.currentTarget.checked)} /><span>Copy notes</span></label>` : null}
      ${(st.imgs || []).length ? html`<label class="check"><input type="checkbox" checked=${photos} onChange=${e => setPhotos(e.currentTarget.checked)} /><span>Attach the same ${plural(st.imgs.length, 'photo')}</span></label>` : null}
      <div class="row end gap"><button class="btn" onClick=${closeSheet}>Cancel</button>
        <button class="btn primary" disabled=${!sel.size} onClick=${apply}>Apply to ${sel.size ? plural(sel.size, 'sample') : 'samples'}</button></div>
    </div>` : html`<p class="muted">No other active sample has an unfinished step named “${st.name}”.</p>`}
  </${Sheet}>`;
}

/* ---------------- log ---------------- */
function LogView() {
  const [kinds, setKinds] = useState(() => new Set());
  const [sid, setSid] = useState('');
  const [q, setQ] = useState('');
  const [limit, setLimit] = useState(150);
  const unit = getSettings().rateUnit;
  const samples = view('samples');
  const qq = norm(q);
  const all = buildEvents();
  const ev = all.filter(e => {
    if (sid && e.sid !== sid) return false;
    const kind = e.st ? e.st.kind : e.type === 'rate' ? e.e.kind : null;
    if (kinds.size && !(kind && kinds.has(kind))) return false;
    if (qq) {
      const hay = e.st ? [e.s.name, e.st.name, e.st.tool, e.st.recipe, e.st.notes, e.st.material, e.st.params].join(' ')
        : e.type === 'rate' ? [e.e.material, e.e.method, e.e.tool, e.e.recipe, e.e.label, e.e.notes].join(' ') : e.s.name;
      if (!norm(hay).includes(qq)) return false;
    }
    return true;
  });
  const flip = k => setKinds(o => { const n = new Set(o); if (n.has(k)) n.delete(k); else n.add(k); return n; });
  const shown = ev.slice(0, limit);
  const days = [];
  for (const e of shown) {
    const d = new Date(e.t); const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!days.length || days[days.length - 1].key !== key) days.push({ key, t: e.t, items: [] });
    days[days.length - 1].items.push(e);
  }
  const sampleOpts = Object.entries(samples).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
  return html`
    <div class="page-head"><h1>Log</h1></div>
    ${all.length ? html`<div class="toolbar log-tools">
        <div class="chips">
          <button class=${'chip-btn' + (kinds.size ? '' : ' on')} aria-pressed=${kinds.size ? 'false' : 'true'} onClick=${() => setKinds(new Set())}>All types</button>
          ${KIND_KEYS.map(k => html`<button class=${'chip-btn' + (kinds.has(k) ? ' on' : '')} aria-pressed=${kinds.has(k) ? 'true' : 'false'} onClick=${() => flip(k)}><${Glyph} kind=${k} size=${14} state=${kinds.has(k) ? 'done' : 'pending'} />${KINDS[k].label}</button>`)}
        </div>
        <div class="row gap log-filter">
          <select aria-label="Sample" class="narrow" value=${sid} onChange=${e => setSid(e.currentTarget.value)}>
            <option value="">All samples</option>${sampleOpts.map(([id, s]) => html`<option value=${id}>${s.name}</option>`)}</select>
          <label class="search grow">${I.search()}<input type="search" aria-label="Search the log" placeholder="Search steps, tools, notes" value=${q} onInput=${e => setQ(e.currentTarget.value)} /></label>
        </div></div>` : null}
    ${!all.length ? html`<${Empty} title="Nothing logged yet"><p>Completed steps appear here with their timestamps, newest first.</p></${Empty}>`
      : !ev.length ? html`<p class="muted pad">Nothing matches these filters.</p>`
      : html`${days.map(d => html`<section class="day" key=${d.key}><h2 class="day-head">${fmtDay(d.t)}</h2>
          <ul class="events">${d.items.map(e => html`<${EventRow} key=${e.key + e.type} e=${e} unit=${unit} />`)}</ul></section>`)}
        ${ev.length > limit ? html`<div class="row center"><button class="btn" onClick=${() => setLimit(limit + 200)}>Show older entries</button></div>` : null}`}`;
}
function EventRow({ e, unit }) {
  if (e.type === 'created') return html`<li class="ev created"><span class="ev-t tnum">${fmtTime(e.t)}</span>
    <span class="ev-g">${icon(html`<path d="M6.6 18.6A8.2 8.2 0 1 1 17.4 18.6Z" />`, 18)}</span>
    <button class="ev-main" onClick=${() => go({ v: 'sample', id: e.sid })}><span class="ev-title">New traveler <span class="ev-sample">${e.s.name}</span></span></button></li>`;
  if (e.type === 'rate') {
    const r = rateOf(e.e);
    return html`<li class="ev"><span class="ev-t tnum">${fmtTime(e.t)}</span><span class="ev-g"><${Glyph} kind=${e.e.kind} state="done" size=${18} /></span>
      <button class="ev-main" onClick=${() => openRateEntry({ id: e.id })}>
        <span class="ev-title">Logged ${e.e.kind === 'etch' ? 'etch' : 'deposition'} run${e.e.label ? html` <span class="ev-sample">${e.e.label}</span>` : null}</span>
        <span class="ev-sub">${[e.e.material, e.e.method, e.e.tool, e.e.recipe].filter(Boolean).join(', ')}
          ${r ? html`<span class=${'badge rate' + (e.e.excl ? ' excl' : '')}>${fmtRate(r.v, r.basis, unit)}</span>` : null}</span></button></li>`;
  }
  const st = e.st;
  const r = e.type === 'done' && isRateKind(st.kind) ? rateOf(st) : null;

/* ---------------- charts ---------------- */
function useWidth(ref, fallback) {
  const [w, setW] = useState(fallback);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    const upd = () => { const x = el.clientWidth; if (x) setW(prev => (Math.abs(x - prev) > 1 ? x : prev)); };
    upd();
    if (typeof ResizeObserver === 'undefined') { addEventListener('resize', upd); return () => removeEventListener('resize', upd); }
    const ro = new ResizeObserver(upd);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return w;
}
function niceStep(range, n) {
  const raw = range / Math.max(1, n);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));

  return { step: nm * p, mant: nm === 10 ? 1 : nm };
}
function tickVals(lo, hi, step) {

  for (let k = a; k <= b && out.length < 400; k++) out.push(+(k * step).toPrecision(12));
  return out;
}
function intStep(range, n) {
  const raw = range / n;
  for (const c of [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000]) if (c >= raw) return c;
  return 1000;
}
function Chart({ pts, color, yLabel, yVar, yUnit, zero, mean, fit }) {
  const ref = useRef();
  const w = useWidth(ref, 340);
  if (!pts.length) return html`<div ref=${ref} class="chart-box"><p class="muted small pad">Nothing to plot for this quantity yet.</p></div>`;
  const M = { l: 72, r: 14, t: 12, b: 56 };
  const pw = Math.max(150, w - M.l - M.r);
  const ph = Math.round(Math.min(pw * 1.1, 470));
  const W = pw + M.l + M.r, H = ph + M.t + M.b;
  const xs = pts.map(p => p.x);
  const x0 = Math.min(...xs) - 0.6, x1 = Math.max(...xs) + 0.6;
  const yv = pts.map(p => p.y);
  if (Number.isFinite(mean)) yv.push(mean);
  let lo = Math.min(...yv), hi = Math.max(...yv);
  if (zero) lo = Math.min(0, lo);
  if (hi === lo) { const d = Math.abs(hi) * 0.1 || 1; if (!(zero && lo === 0)) lo -= d; hi += d; }
  const pad = (hi - lo) * 0.08;
  const a = zero && lo >= 0 ? 0 : lo - pad, b = hi + pad;
  const ys = niceStep(b - a, 5);
  const y0 = zero && lo >= 0 ? 0 : Math.floor(a / ys.step) * ys.step;
  const y1 = Math.ceil(b / ys.step) * ys.step;
  const yMinor = ys.step / (ys.mant === 2 ? 4 : 5);
  const xst = intStep(x1 - x0, 6);
  const xMinor = xst >= 5 ? xst / 5 : xst > 1 ? 1 : 0;
  const X = x => M.l + ((x - x0) / (x1 - x0)) * pw;
  const Y = y => M.t + ph - ((y - y0) / (y1 - y0)) * ph;
  const dec = Math.max(0, -Math.floor(Math.log10(ys.step) + 1e-9) + (ys.mant === 2.5 ? 1 : 0));
  const yT = tickVals(y0, y1, ys.step), yM = tickVals(y0, y1, yMinor).filter(v => !yT.some(t => Math.abs(t - v) < yMinor * 1e-3));
  const xT = tickVals(x0, x1, xst), xM = xMinor ? tickVals(x0, x1, xMinor).filter(v => !xT.includes(v)) : [];

  const tk = [];
  for (const v of yT) tk.push(`M${M.l},${Y(v)}h${L}M${R},${Y(v)}h${-L}`);
  for (const v of yM) tk.push(`M${M.l},${Y(v)}h${Lm}M${R},${Y(v)}h${-Lm}`);
  for (const v of xT) tk.push(`M${X(v)},${B}v${-L}M${X(v)},${M.t}v${L}`);
  for (const v of xM) tk.push(`M${X(v)},${B}v${-Lm}M${X(v)},${M.t}v${Lm}`);
  return html`<div ref=${ref} class="chart-box">
    <svg class="chart" width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`${yLabel} by run number`}>
      <defs><clipPath id="plotclip"><rect x=${M.l} y=${M.t} width=${pw} height=${ph} /></clipPath></defs>
      <g clip-path="url(#plotclip)">
        ${Number.isFinite(mean) ? html`<line x1=${M.l} x2=${R} y1=${Y(mean)} y2=${Y(mean)} stroke="var(--neutral)" stroke-width="1" stroke-dasharray="5 4" />` : null}
        ${fit ? html`<line x1=${X(fit.x0)} x2=${X(fit.x1)} y1=${Y(fit.y0)} y2=${Y(fit.y1)} stroke=${color} stroke-width="1" />` : null}
        ${pts.map(p => p.excl
          ? html`<g stroke="var(--neutral)" stroke-width="1.5"><path d=${`M${X(p.x) - 4},${Y(p.y) - 4}L${X(p.x) + 4},${Y(p.y) + 4}M${X(p.x) + 4},${Y(p.y) - 4}L${X(p.x) - 4},${Y(p.y) + 4}`} /><title>${p.title}</title></g>`
          : html`<circle cx=${X(p.x)} cy=${Y(p.y)} r="4.7" fill="var(--marker-fill)" stroke=${color} stroke-width="1.5"><title>${p.title}</title></circle>`)}
      </g>
      <path d=${tk.join('')} stroke="var(--ink)" stroke-width="1" fill="none" />
      <rect x=${M.l} y=${M.t} width=${pw} height=${ph} fill="none" stroke="var(--ink)" stroke-width="1.1" />
      ${yT.map(v => html`<text x=${M.l - 7} y=${Y(v)} dy="0.34em" text-anchor="end">${v.toFixed(dec)}</text>`)}
      ${xT.map(v => html`<text x=${X(v)} y=${B + 19} text-anchor="middle">${v}</text>`)}
      <text class="ax" x=${M.l + pw / 2} y=${H - 12} text-anchor="middle">Run Number, <tspan font-style="italic">n</tspan></text>
      <text class="ax" transform=${`translate(17 ${M.t + ph / 2}) rotate(-90)`} text-anchor="middle">${yLabel}${yVar ? ', ' : ''}${yVar ? html`<tspan font-style="italic">${yVar}</tspan>` : null}${yUnit ? ` (${yUnit})` : ''}</text>
    </svg></div>`;
}
function Spark({ vals, color }) {
  if (vals.length < 2) return html`<span class="spark-empty" />`;
  const w = 72, h = 26;
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;

  const last = pts[pts.length - 1];
  return html`<svg class="spark" width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} aria-hidden="true">
    <polyline points=${pts.map(p => p.map(c => c.toFixed(1)).join(',')).join(' ')} fill="none" stroke=${color} stroke-width="1.4" stroke-linejoin="round" />
    <circle cx=${last[0]} cy=${last[1]} r="2.8" fill="var(--marker-fill)" stroke=${color} stroke-width="1.4" /></svg>`;
