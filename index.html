/* ---------------- import ---------------- */
function aiErrText(e) {
  const c = e && e.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) return 'Claude is not available to this page. Use “Split by line” instead.';
  if (c === 'rate_limited') return 'Claude is busy or your usage limit is reached. Try again later.';
  if (c === 'prompt_too_large') return 'That text is too long. Paste the traveler in parts.';
  if (c === 'invalid_json') return 'The reply could not be read as a list of steps. Try again.';
  if (c === 'session_expired') return 'Sign in to claude.ai again, then retry.';
  if (c === 'refused' || c === 'empty_completion') return 'Claude could not convert this text. Try “Split by line”.';
  return 'Could not reach Claude. Try again.';
}
function ImportView() {
  const [text, setText] = useState('');
  const [steps, setSteps] = useState(null);
  const [busy, setBusy] = useState(false);
  const [chars, setChars] = useState(0);
  const [err, setErr] = useState('');
  const [aiOff, setAiOff] = useState(false);
  const [name, setName] = useState('Imported traveler');
  const ctl = useRef(null);
  const ask = LOCAL ? null : store.caps.ask;
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const runAi = async () => {
    if (!ask || !text.trim()) return;
    setBusy(true); setErr(''); setChars(0);
    const c = new AbortController();
    ctl.current = c;
    try {
      const out = await ask.json(aiPrompt(text), { signal: c.signal, cache: false, onText: ({ text: t }) => setChars(t.length) });
      const cleaned = cleanAiSteps(out);
      if (!cleaned.length) setErr('No steps came back. Check that the pasted text is the traveler, then try again.');
      else setSteps(cleaned.map(x => ({ ...x, id: newId('s'), on: true })));
    } catch (e) {
      if (!(e && e.code === 'cancelled')) {
        setErr(aiErrText(e));
        if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e && e.code)) setAiOff(true);
      }
    } finally { setBusy(false); ctl.current = null; }
  };
  const split = () => { const s = parseLines(text); if (!s.length) { setErr('No lines found.'); return; } setErr(''); setSteps(s.map(x => ({ ...x, id: newId('s'), on: true }))); };
  const upd = (i, patch) => setSteps(steps.map((s, j) => (j === i ? { ...s, ...patch } : s)));
  const save = () => {
    const keep = steps.filter(s => s.on && s.name.trim());
    if (!keep.length) return;
    const id = newId('t');
    put('templates', id, { v: 1, name: name.trim() || 'Imported traveler', desc: '', created: Date.now(), steps: keep.map(s => ({ id: newId('s'), ...pickTpl(s) })) });
    go({ v: 'template', id }, true);
    toast(`Template saved with ${plural(keep.length, 'step')}`);
  };
  const nOn = steps ? steps.filter(s => s.on).length : 0;
  return html`
    <${BackLink} label="Templates" fallback=${{ v: 'templates' }} />
    <h1>Import a traveler</h1>
    ${!steps ? html`
      <p class="lede">Copy the rows of your traveler from Excel, Word or a PDF and paste them here. ${ask && !aiOff ? 'Claude can sort them into steps; you review everything before saving.' : 'Each line becomes a step; separate tool, recipe and conditions with tabs or a “|”.'}</p>
      <textarea class="paste" rows="12" placeholder="Paste traveler rows here" value=${text} onInput=${e => setText(e.currentTarget.value)} />
      ${err ? html`<p class="warn">${err}</p>` : null}
      <div class="row gap wrap">
        ${ask && !aiOff ? html`<button class="btn primary" disabled=${!text.trim() || busy} onClick=${runAi}>${I.spark()}<span>${busy ? (chars ? `Reading… ${chars} characters` : 'Thinking…') : 'Sort into steps with Claude'}</span></button>` : null}
        ${busy ? html`<button class="btn" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button>` : null}
        <button class=${'btn' + (ask && !aiOff ? '' : ' primary')} disabled=${!text.trim() || busy} onClick=${split}>Split by line</button>
      </div>
      ${ask && !aiOff ? html`<p class="small muted">Uses your Claude account; the first time, Claude asks you to allow this page. Values are copied as written, never estimated.</p>` : null}`
    : html`
      <p class="lede">Check each step. Untick anything that is not a step; you can edit everything later in the template.</p>
      <${Field} label="Template name"><input value=${name} onInput=${e => setName(e.currentTarget.value)} /></${Field}>
      <ol class="import-list">${steps.map((s, i) => html`<li key=${s.id} class=${s.on ? '' : 'off'}>
        <input type="checkbox" aria-label=${'Include step ' + (i + 1)} checked=${s.on} onChange=${e => upd(i, { on: e.currentTarget.checked })} />
        <div class="imp-main">
          <div class="row gap"><${Glyph} kind=${s.kind} size=${18} /><input class="imp-name" aria-label="Step name" value=${s.name} onInput=${e => upd(i, { name: e.currentTarget.value })} />
            <select aria-label="Type" class="narrow" value=${s.kind} onChange=${e => upd(i, { kind: e.currentTarget.value })}>${KIND_KEYS.map(k => html`<option value=${k}>${KINDS[k].label}</option>`)}</select></div>
          ${s.tool || s.recipe || s.method || s.material ? html`<div class="small muted">${[s.tool, s.recipe, s.method, s.material].filter(Boolean).join(', ')}</div>` : null}
          ${s.params ? html`<div class="small imp-params">${s.params}</div>` : null}
        </div></li>`)}</ol>
      <div class="row gap wrap end sticky-actions">
        <button class="btn" onClick=${() => setSteps(null)}>Back to text</button>
        <button class="btn primary" disabled=${!nOn} onClick=${save}>Save template with ${plural(nOn, 'step')}</button></div>`}`;
}

/* ---------------- settings ---------------- */
const fmtBytes = b => b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${(b / 1e6).toFixed(b < 1e7 ? 1 : 0)} MB`;
function SettingsView() {
  const S = getSettings();
  const [usage, setUsage] = useState('');
  const checkUsage = async () => {
    try { const r = await store.caps.assets.list(); const u = r.usage; setUsage(`${plural(u.files, 'file')}, ${fmtBytes(u.bytes)} of ${fmtBytes(u.maxBytes)}`); }
    catch (e) { setUsage('Could not read storage use.'); }
  };
  const restore = async e => {
    const file = e.currentTarget.files && e.currentTarget.files[0];
    e.currentTarget.value = '';
    if (!file) return;
    let data = null;
    try { data = JSON.parse(await file.text()); } catch (x) { data = null; }
    if (!data || data.app !== 'ProcessTracer') { toast('That file is not a ProcessTracer backup.', { error: true }); return; }
    const n = c => Object.keys(data[c] || {}).length;
    const when = data.exported ? fmtDT(Date.parse(data.exported)) : 'an unknown date';
    if (!(await confirmBox({ title: 'Restore this backup?', ok: 'Restore',
      body: `${plural(n('samples'), 'sample')}, ${plural(n('templates'), 'template')} and ${plural(n('ratelog'), 'logged run')} from ${when}. Items with the same internal ID are replaced; everything else stays.` }))) return;
    let count = 0;
    for (const c of COLS) for (const [did, doc] of Object.entries(data[c] || {})) {
      if (doc && typeof doc === 'object' && !Array.isArray(doc) && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(did)) { put(c, did, doc); count++; }
    }
    toast(`Restored ${plural(count, 'item')}`);
  };
  const where = store.mode === 'db'
    ? 'Saved privately to your Claude account in this page’s storage. If you share the page, each person gets their own empty traveler; nobody sees yours. Backups hold text and numbers; photos stay in the page, and the printable traveler embeds them.'
    : 'Nothing is being saved in this view.';
  return html`
    <h1>Settings</h1>
    <section class="set-group"><h2>Logging</h2>
      <${Field} label="Your initials" hint="Added to steps you start or complete."><input class="short" value=${S.initials} maxlength="8" autocapitalize="characters" onInput=${e => putSettings({ initials: e.currentTarget.value })} /></${Field}>
    </section>
    <section class="set-group"><h2>Rates</h2>
      <div class="grid2">
        <${Field} label="Show rates in"><select value=${S.rateUnit} onChange=${e => putSettings({ rateUnit: e.currentTarget.value })}>${Object.keys(RATE_UNITS).map(u => html`<option value=${u}>${u}</option>`)}</select></${Field}>
        <${Field} label="Recent window" hint="Runs used for the mean, spread and time estimates."><select value=${String(S.win)} onChange=${e => putSettings({ win: Number(e.currentTarget.value) })}>
          ${[[3, 'Last 3 runs'], [5, 'Last 5 runs'], [10, 'Last 10 runs'], [0, 'All runs']].map(([v, l]) => html`<option value=${String(v)}>${l}</option>`)}</select></${Field}>
      </div>
    </section>
    <section class="set-group"><h2>Photos</h2>
      <${Field} label="Resize photos to" hint="Longest side. Smaller files upload faster from the bay."><select class="short" value=${String(S.imgMax)} onChange=${e => putSettings({ imgMax: Number(e.currentTarget.value) })}>
        ${[[1600, '1600 px'], [2400, '2400 px'], [0, 'Original size']].map(([v, l]) => html`<option value=${String(v)}>${l}</option>`)}</select></${Field}>
      ${store.caps.assets && !LOCAL ? html`<div class="row gap wrap"><button class="btn sm" onClick=${checkUsage}>Check photo storage</button>${usage ? html`<span class="small muted">${usage}</span>` : null}</div>` : null}
    </section>
    ${LOCAL ? html`<${LocalDataSection} />` : html`<section class="set-group"><h2>Your data</h2>
      <p class="small muted">${where}</p>
      <div class="row gap wrap">
        <button class="btn" onClick=${() => saveFile(`processtracer_rates_${fileStamp()}.csv`, ratesCsv())}>${I.download()}<span>Rate history (CSV)</span></button>
        <button class="btn" onClick=${() => saveFile(`processtracer_backup_${fileStamp()}.json`, backupJson())}>${I.download()}<span>Full backup (JSON)</span></button>
        <label class="btn">${I.upload()}<span>Restore a backup</span><input class="vh" type="file" accept="application/json,.json" onChange=${restore} /></label>
      </div>
    </section>`}`;
}

/* ---------------- on-device version: backups, sync by file, install hints ---------------- */
const DAY_MS = 86400000;
const bk = { last: null, dismissed: false, hintOff: true, persisted: null, busy: false,
  folder: { handle: null, state: 'none', name: '', busy: false, last: 0 } };
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => { try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };
const coarse = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
const MIME = { csv: 'text/csv', json: 'application/json', html: 'text/html', zip: 'application/zip', jpg: 'image/jpeg', jpeg: 'image/jpeg',
  png: 'image/png', webp: 'image/webp', gif: 'image/gif', pdf: 'application/pdf', txt: 'text/plain', heic: 'image/heic' };
const EXT_OF = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'application/pdf': 'pdf', 'image/heic': 'heic' };
const extOf = n => (String(n).split('.').pop() || '').toLowerCase();
const BACKUP_README = [
  'ProcessTracer backup',
  '',
  'processtracer.json  every sample, step, template, logged run and setting',
  'photos/             photos and PDFs attached to steps (file name = photo id)',
  'rates.csv           every etch and deposition rate, for plotting',
  '',
  'To restore or sync: open ProcessTracer, go to Settings, tap Import a backup and pick this .zip.',
  'For each sample, template and logged run the newest edit wins; deletions carry over.',
  '',
].join('\r\n');

if (LOCAL) {
  LocalRT.ready.then(async () => {
    if (!LocalRT.ok) return;
    try { bk.last = (await LocalRT.meta.get('lastBackup')) || null; } catch (e) { /* ignore */ }
    try { bk.hintOff = !!(await LocalRT.meta.get('hintOff')); } catch (e) { bk.hintOff = false; }
    await folderInit();
    bump();
  });
  try {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted()
        .then(v => { bk.persisted = v; if (!v && navigator.storage.persist && (isStandalone() || !isIOS())) return navigator.storage.persist().then(p => { bk.persisted = p; }); return null; })
        .then(() => bump(), () => {});
    }
  } catch (e) { /* not supported */ }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const reg = () => navigator.serviceWorker.register('./sw.js').catch(() => {});
    if (document.readyState === 'complete') reg(); else addEventListener('load', reg);
  }
  LocalRT.onChange(() => scheduleFolderBackup(false));
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && bk.folder.state === 'ready' && Date.now() - (bk.folder.last || 0) > 120000) folderBackup(false);
  });
}

/* ---------- what changed and when ---------- */
function latestChange() {
  let t = 0;
  for (const col of COLS) for (const d of Object.values(view(col))) t = Math.max(t, Number(d.updated) || 0);
  const pre = LocalRT.BASE + '/';
  for (const [k, at] of LocalRT.tombs) if (k.startsWith(pre)) t = Math.max(t, Number(at) || 0);
  return t;
}
function oldestData() {
  let t = Infinity;
  for (const col of COLS) for (const d of Object.values(view(col))) t = Math.min(t, Number(d.created || d.updated) || Infinity);
  return t;
}
function backupDue() {
  if (store.mode !== 'db') return null;
  const every = Number(getSettings().backupEvery);
  const latest = latestChange();
  const last = bk.last ? bk.last.at : 0;
  if (!every || !latest || latest <= last) return null;
  if (last) return Date.now() - last > every * DAY_MS ? { last } : null;
  return Date.now() - oldestData() > DAY_MS ? { last: 0 } : null;
}
async function markBackedUp(how) {
  bk.last = { at: Date.now(), how };
  try { await LocalRT.meta.set('lastBackup', bk.last); } catch (e) { /* ignore */ }
  bump();
}

/* ---------- saving files: share sheet on phones, download elsewhere ---------- */
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}
async function localSaveFile(filename, data, opts = {}) {
  const type = MIME[extOf(filename)] || 'application/octet-stream';
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  let file = null, share = false;
  try { file = new File([blob], filename, { type: blob.type || type }); } catch (e) { file = null; }
  try { share = !!(file && coarse() && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { share = false; }
  if (!share) { downloadBlob(blob, filename); if (opts.onSaved) opts.onSaved(); return true; }
  try { await navigator.share({ files: [file], title: filename }); if (opts.onSaved) opts.onSaved(); return true; }
  catch (e) {
    if (e && e.name === 'AbortError') return false;
    openSheet(() => html`<${ReadySheet} file=${file} onSaved=${opts.onSaved} />`);
    return false;
  }
}
function ReadySheet({ file, onSaved }) {
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true);
    try { await navigator.share({ files: [file], title: file.name }); closeSheet(); if (onSaved) onSaved(); }
    catch (e) { if (!(e && e.name === 'AbortError')) { downloadBlob(file, file.name); closeSheet(); if (onSaved) onSaved(); } }
    finally { setBusy(false); }
  };
  return html`<${Sheet} title="File ready" onClose=${closeSheet}>
    <p class="lede"><b>${file.name}</b>, ${fmtBytes(file.size)}. Save it to Files (iCloud Drive, Google Drive or On My iPhone), or AirDrop it to your computer.</p>
    <div class="row end gap"><button class="btn" onClick=${closeSheet}>Cancel</button>
      <button class="btn primary" disabled=${busy} onClick=${go}>${I.download()}<span>Save or share</span></button></div>
  </${Sheet}>`;
}

/* ---------- backup ---------- */
function backupData() {
  const tombs = {};
  const pre = LocalRT.BASE + '/';
  for (const [k, at] of LocalRT.tombs) if (k.startsWith(pre)) { const rest = k.slice(pre.length); if (rest.split('/').length === 2) tombs[rest] = at; }
  return { app: 'ProcessTracer', format: 2, exported: new Date().toISOString(),
    samples: view('samples'), templates: view('templates'), ratelog: view('ratelog'), settings: getSettings(), tombs, photos: {} };
}
async function buildBackupZip() {
  const data = backupData();
  const refs = new Map();
  for (const s of Object.values(data.samples)) for (const st of s.steps || []) for (const im of st.imgs || []) if (im && im.id) refs.set(im.id, im.type || 'image/jpeg');
  const entries = [];
  let missing = 0;
  for (const [id, type] of refs) {
    let b = null;
    try { b = await store.caps.assets.get(id); } catch (e) { b = null; }
    if (!b) { missing++; continue; }
    const t = b.type || type;
    const file = `photos/${id}.${EXT_OF[t] || 'bin'}`;
    data.photos[id] = { type: t, file };
    entries.push({ name: file, data: b });
  }
  entries.unshift({ name: 'processtracer.json', data: JSON.stringify(data, null, 1) });
  entries.push({ name: 'rates.csv', data: ratesCsv() });
  entries.push({ name: 'README.txt', data: BACKUP_README });
  return { zip: await makeZip(entries), photos: refs.size - missing, missing };
}
async function backupNow() {
  if (bk.busy || store.mode !== 'db') return;
  bk.busy = true;
  bump();
  try {
    const { zip, missing } = await buildBackupZip();
    const d = new Date();
    const name = `ProcessTracer-backup-${fileStamp()}-${pad2(d.getHours())}${pad2(d.getMinutes())}.zip`;
    await localSaveFile(name, zip, { onSaved: () => {
      markBackedUp('file');
      toast(missing ? `Backup saved. ${plural(missing, 'photo')} could not be found on this device.` : 'Backup saved');
    } });
  } catch (e) {
    toast('Could not make the backup. Free some space and try again.', { error: true });
  } finally { bk.busy = false; bump(); }
}

/* ---------- import and merge ---------- */
const okId = id => /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(String(id));
const okDoc = v => !!v && typeof v === 'object' && !Array.isArray(v);
async function parseBackup(file) {
  const head = new Uint8Array(await toBuf(file.slice(0, 4)));
  const bad = () => new Error('That file is not a ProcessTracer backup.');
  if (head[0] === 0x50 && head[1] === 0x4b) {
    const z = await readZip(file);
    const jsonName = z.names.find(n => /(^|\/)processtracer\.json$/.test(n) && !n.startsWith('__MACOSX'));
    if (!jsonName) throw bad();
    let data;
    try { data = JSON.parse(await (await z.entry(jsonName)).text()); } catch (e) { throw bad(); }
    const photos = new Map();
    for (const n of z.names) {
      const m = /(?:^|\/)photos\/([A-Za-z0-9_-]{6,64})\.\w+$/.exec(n);
      if (m && !n.startsWith('__MACOSX')) photos.set(m[1], n);
    }
    return { data, z, photos };
  }
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { throw bad(); }
  return { data, z: null, photos: new Map() };
}
async function planMerge(src) {
  const d = src.data;
  const plan = { add: [], update: [], del: [], keep: 0, same: 0, photoAdds: [], photosMissing: 0, settings: null };
  for (const col of COLS) {
    const local = view(col);
    for (const [id, doc] of Object.entries(okDoc(d[col]) ? d[col] : {})) {
      if (!okId(id) || !okDoc(doc)) continue;
      const u = Number(doc.updated) || 0;
      const cur = local[id];
      if (!cur) {
        const t = LocalRT.tombs.get(`${LocalRT.BASE}/${col}/${id}`);
        if (t && t >= u) plan.keep++;
        else plan.add.push([col, id, doc]);
      } else {
        const cu = Number(cur.updated) || 0;
        if (u > cu) plan.update.push([col, id, doc]);
        else if (u === cu) plan.same++;
        else plan.keep++;
      }
    }
  }
  for (const [key, at] of Object.entries(okDoc(d.tombs) ? d.tombs : {})) {
    const [col, id] = key.split('/');
    if (!COLS.includes(col) || !okId(id || '')) continue;
    const cur = view(col)[id];
    if (cur && (Number(cur.updated) || 0) < Number(at)) plan.del.push([col, id]);
  }
  const replaced = new Set(plan.update.concat(plan.del).map(([c, i]) => c + '/' + i));
  const incoming = new Set(), keepLocal = new Set();
  const collect = (s, set) => (s.steps || []).forEach(st => (st.imgs || []).forEach(im => { if (im && im.id) set.add(im.id); }));
  for (const [id, s] of Object.entries(view('samples'))) if (!replaced.has('samples/' + id)) collect(s, keepLocal);
  for (const [col, , doc] of plan.add.concat(plan.update)) if (col === 'samples') collect(doc, incoming);
  for (const id of new Set([...incoming, ...keepLocal])) {
    if (await store.caps.assets.has(id)) continue;
    if (src.photos.has(id)) plan.photoAdds.push([id, src.photos.get(id)]);
    else if (incoming.has(id)) plan.photosMissing++;
  }
  const ls = getSettings();
  if (okDoc(d.settings) && (Number(d.settings.updated) || 0) > (Number(ls.updated) || 0)) plan.settings = d.settings;
  return plan;
}
async function onImportFile(e) {
  const file = e.currentTarget.files && e.currentTarget.files[0];
  e.currentTarget.value = '';
  if (!file || store.mode !== 'db') return;
  let src;
  try { src = await parseBackup(file); }
  catch (x) { toast((x && x.message) || 'That file is not a ProcessTracer backup.', { error: true }); return; }
  if (!okDoc(src.data) || src.data.app !== 'ProcessTracer') { toast('That file is not a ProcessTracer backup.', { error: true }); return; }
  const plan = await planMerge(src);
  openSheet(() => html`<${MergeSheet} plan=${plan} src=${src} name=${file.name} />`);
}
function mergeSummary(p) {
  const parts = [];
  if (p.add.length) parts.push(`${p.add.length} new`);
  if (p.update.length) parts.push(`${p.update.length} updated`);
  if (p.del.length) parts.push(`${p.del.length} removed`);
  if (p.photoAdds.length) parts.push(plural(p.photoAdds.length, 'photo') + ' added');
  return parts.length ? 'Merged: ' + parts.join(', ') : 'Settings updated';
}
function MergeSheet({ plan, src, name }) {
  const [prog, setProg] = useState(null);
  const n = plan.add.length + plan.update.length + plan.del.length + plan.photoAdds.length + (plan.settings ? 1 : 0);
  const when = src.data.exported ? fmtDT(Date.parse(src.data.exported)) : 'an unknown date';
  const run = async () => {
    setProg({ k: 0, n: plan.photoAdds.length });
    try {
      let k = 0;
      for (const [id, entryName] of plan.photoAdds) {
        const b = await src.z.entry(entryName);
        const t = (src.data.photos && src.data.photos[id] && src.data.photos[id].type) || MIME[extOf(entryName)] || 'image/jpeg';
        await store.caps.assets.putId(id, b, t);
        setProg({ k: ++k, n: plan.photoAdds.length });
      }
      for (const [col, id, doc] of plan.add.concat(plan.update)) put(col, id, doc, 0, true);
      for (const [col, id] of plan.del) removeDoc(col, id);
      if (plan.settings) putSettings(plan.settings);
      blobMissing.clear();
      closeSheet();
      toast(mergeSummary(plan));
    } catch (e) {
      setProg(null);
      toast('Import stopped before any samples changed. ' + ((e && e.message) || 'The backup could not be read.'), { error: true });
    }
  };
  const row = (label, v) => (v ? html`<div class="merge-row"><span>${label}</span><b class="tnum">${v}</b></div>` : null);
  return html`<${Sheet} title="Merge this backup?" onClose=${prog ? () => {} : closeSheet}>
    <p class="lede"><b>${name}</b>, made ${when}.</p>
    <div class="merge-list">
      ${row('New on this device', plan.add.length)}
      ${row('Newer than the copy here', plan.update.length)}
      ${row('Deleted on the other device', plan.del.length)}
      ${row('Photos to add', plan.photoAdds.length)}
      ${row('Kept, because the copy here is newer', plan.keep)}
      ${row('Already the same', plan.same)}
      ${plan.settings ? html`<div class="merge-row"><span>Newer settings</span><b>yes</b></div>` : null}
    </div>
    ${plan.photosMissing ? html`<p class="small caution">${plural(plan.photosMissing, 'photo')} in this backup's samples are not included in the file. Backups made in the Claude version hold no photos.</p>` : null}
    <p class="small muted">For each sample, template and logged run, the newest edit wins. Nothing newer on this device is overwritten.</p>
    ${prog ? html`<p class="small">${prog.n ? `Adding photos, ${prog.k} of ${prog.n}…` : 'Merging…'}</p>` : null}
    <div class="row end gap"><button class="btn" disabled=${!!prog} onClick=${closeSheet}>Cancel</button>
      <button class="btn primary" disabled=${!n || !!prog} onClick=${run}>${n ? 'Merge' : 'Nothing new to merge'}</button></div>
  </${Sheet}>`;
}

/* ---------- automatic backups into a folder (Chrome or Edge on a computer) ---------- */
let folderTimer = null;
const folderSupported = () => typeof window.showDirectoryPicker === 'function' && !coarse();
async function folderInit() {
  if (typeof window.showDirectoryPicker !== 'function') return;
  let h = null;
  try { h = await LocalRT.meta.get('dir'); } catch (e) { h = null; }
  if (!h) return;
  const f = bk.folder;
  f.handle = h;
  f.name = h.name || 'backup folder';
  try { f.last = (await LocalRT.meta.get('folderLast')) || 0; } catch (e) { f.last = 0; }
  let p = 'prompt';
  try { p = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { p = 'prompt'; }
  f.state = p === 'granted' ? 'ready' : 'needs-permission';
  if (f.state === 'ready') scheduleFolderBackup(true);
}
function scheduleFolderBackup(soon) {
  const f = bk.folder;
  if (f.state !== 'ready') return;
  clearTimeout(folderTimer);
  const wait = Math.max(soon ? 5000 : 90000, 10 * 60000 - (Date.now() - (f.last || 0)));
  folderTimer = setTimeout(() => folderBackup(false), wait);
}
async function writeInto(dir, name, blob) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob);
  await w.close();
}
async function pruneFolder(dir) {
  const dated = [];
  for await (const [name] of dir.entries()) if (/^ProcessTracer-\d{8}\.zip$/.test(name)) dated.push(name);
  dated.sort();
  for (const n of dated.slice(0, Math.max(0, dated.length - 14))) { try { await dir.removeEntry(n); } catch (e) { /* ignore */ } }
}
async function folderBackup(manual) {
  const f = bk.folder;
  if (f.state !== 'ready' || f.busy || store.mode !== 'db') return;
  if (!manual && latestChange() <= (f.last || 0)) return;
  f.busy = true;
  bump();
  try {
    const { zip } = await buildBackupZip();
    await writeInto(f.handle, 'ProcessTracer-latest.zip', zip);
    await writeInto(f.handle, `ProcessTracer-${fileStamp()}.zip`, zip);
    await pruneFolder(f.handle);
    f.last = Date.now();
    try { await LocalRT.meta.set('folderLast', f.last); } catch (e) { /* ignore */ }
    await markBackedUp('folder');
    if (manual) toast(`Backed up to ${f.name}`);
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) f.state = 'needs-permission';
    toast(f.state === 'needs-permission' ? 'Allow access to the backup folder again in Settings.' : 'Folder backup failed. Use Back up now instead.', { error: true });
  } finally { f.busy = false; bump(); }
}
async function folderChoose() {
  try {
    const h = await window.showDirectoryPicker({ id: 'processtracer', mode: 'readwrite' });
    await LocalRT.meta.set('dir', h);
    Object.assign(bk.folder, { handle: h, name: h.name || 'backup folder', state: 'ready', last: 0 });
    bump();
    folderBackup(true);
  } catch (e) { if (!(e && e.name === 'AbortError')) toast('Could not use that folder.', { error: true }); }
}
async function folderReconnect() {
  const f = bk.folder;
  try { f.state = (await f.handle.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'ready' : 'needs-permission'; }
  catch (e) { f.state = 'needs-permission'; }
  bump();
  if (f.state === 'ready') folderBackup(true);
}
async function folderStop() {
  try { await LocalRT.meta.del('dir'); } catch (e) { /* ignore */ }
  clearTimeout(folderTimer);
  Object.assign(bk.folder, { handle: null, state: 'none', name: '', last: 0 });
  bump();
}
function FolderBackup() {
  const f = bk.folder;
  if (f.state === 'none') return html`<div class="folder-box">
    <p class="small">On this computer, ProcessTracer can also save backups into a folder automatically, such as a Google Drive or Dropbox folder.</p>
    <div><button class="btn" onClick=${folderChoose}>Choose a backup folder</button></div></div>`;
  if (f.state === 'needs-permission') return html`<div class="folder-box">
    <p class="small caution">Automatic backups to “${f.name}” are paused until you allow access again.</p>
    <div class="row gap wrap"><button class="btn" onClick=${folderReconnect}>Allow access</button><button class="btn ghost" onClick=${folderStop}>Stop folder backups</button></div></div>`;
  return html`<div class="folder-box">
    <p class="small">Backing up automatically to “${f.name}”${f.last ? `, last ${fmtDT(f.last)}` : ''}. The newest is ProcessTracer-latest.zip; the last 14 daily copies are kept.</p>
    <div class="row gap wrap"><button class="btn sm" disabled=${f.busy} onClick=${() => folderBackup(true)}>${f.busy ? 'Backing up…' : 'Back up to folder now'}</button>
      <button class="btn sm ghost" onClick=${folderStop}>Stop</button></div></div>`;
}

    case 'log': return html`<${LogView} />`;

    case 'rate': return html`<${RateGroupView} key=${r.key} gk=${r.key} />`;
    case 'templates': return html`<${TemplatesView} />`;
    case 'template': return html`<${TemplateEditView} key=${r.id} id=${r.id} step=${r.step} />`;
    case 'import': return html`<${ImportView} />`;
    case 'settings': return html`<${SettingsView} />`;
    default: return html`<${SamplesView} />`;
  }
}
function App() {
  const [, force] = useState(0);
  const seen = useRef(store.ver);
  seen.current = store.ver;
  useEffect(() => {
    const f = () => force(x => x + 1);
    subs.add(f);
    if (store.ver !== seen.current) f(); // catch changes made before this subscription existed
    return () => subs.delete(f);
  }, []);
  const r = nav.route;
  const active = (TABS.find(t => t.match.includes(r.v)) || {}).v;
  return html`
    <header class="topbar"><div class="topbar-in">
      <button class="brand" onClick=${() => go({ v: 'samples' })}>ProcessTracer</button>
      <nav class="tabbar" aria-label="Sections">${TABS.map(t => html`<button key=${t.v} class="tab" aria-current=${active === t.v ? 'page' : null}
        onClick=${() => { if (r.v !== t.v) go({ v: t.v }); }}>${t.icon()}<span>${t.label}</span></button>`)}</nav>
      <span class="grow" />
      <${SaveState} />
      <button class=${'icon-btn' + (r.v === 'settings' ? ' on' : '')} aria-label="Settings" onClick=${() => { if (r.v !== 'settings') go({ v: 'settings' }); }}>${I.gear()}</button>
    </div></header>
    ${store.note ? html`<div class="banner" role="status">${store.note}</div>` : null}
    ${LOCAL && store.loaded ? html`<${LocalBanners} />` : null}
    ${store.saveErr ? html`<div class="banner err" role="alert"><span>${store.saveErr}</span><button class="btn sm" onClick=${() => writer.retryFailed()}>Retry</button></div>` : null}
    <main id="main">${store.loaded ? html`<${Route} r=${r} />` : html`<${Loading} />`}</main>
    ${ui.lightbox ? html`<${Lightbox} />` : null}
    ${ui.sheet ? html`<div key=${ui.sheet.id}>${ui.sheet.render()}</div>` : null}
    <${Toasts} />
    <${DataLists} />`;
}
const { useErrorBoundary } = window.htmPreact;
function Root() {
  const [err, reset] = useErrorBoundary(e => { try { console.error(e); } catch (x) { /* ignore */ } });
  if (err) return html`<main class="crash"><h1>This screen hit an error</h1>
    <p class="muted">${String((err && err.message) || err)}</p><p>Your saved data is not affected.</p>
    <button class="btn primary" onClick=${() => { nav.route = { v: 'samples' }; nav.stack = []; ui.sheet = null; ui.lightbox = null; reset(); bump(); }}>Back to samples</button></main>`;
  return html`<${App} />`;
}
render(html`<${Root} />`, document.getElementById('app'));
boot();

</script>
</body>
</html>
