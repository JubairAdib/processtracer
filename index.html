<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProcessTracer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Cleanroom process traveler. Your data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ProcessTracer</title>
<style>
:root {
  --font: "Helvetica Neue", Helvetica, "TeX Gyre Heros", Arial, "Liberation Sans", sans-serif;
  --paper: #F3F5F8; --surface: #FFFFFF; --surface-2: #EBEEF3;
  --ink: #172029; --ink-2: #46515F; --ink-3: #5F6A78;
  --rule: #D9DEE5; --rule-2: #BAC2CD;
  --accent: #33449A; --accent-2: #E6E9F6; --accent-ink: #FFFFFF; --stamp: #33449A; --focus: #33449A;
  --run: #E2AD35; --run-ink: #3B2A00; --run-text: #7A5300; --run-tint: #FAF0D7;
  --danger: #B42318; --danger-solid: #B42318; --danger-tint: #FBE9E7;
  --neutral: #7F8C8D; --marker-fill: #FFFFFF;
  --k-clean: #7F8C8D; --k-litho: #E2AD35; --k-etch: #B43875; --k-dep: #6E8BD7;
  --k-thermal: #D46927; --k-metrology: #7463C6; --k-other: #9AA3AE;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141A; --surface: #171D25; --surface-2: #202832;
    --ink: #E6EBF1; --ink-2: #B4BECA; --ink-3: #95A0AD;
    --rule: #2B3440; --rule-2: #435061;
    --accent: #A3B3F4; --accent-2: #232C47; --accent-ink: #0F141A; --stamp: #A3B3F4; --focus: #A3B3F4;
    --run: #E2AD35; --run-ink: #2A1E00; --run-text: #EDC260; --run-tint: #362C12;
    --danger: #F2968D; --danger-solid: #C2372C; --danger-tint: #3B1F1C;
    --neutral: #97A3A4; --marker-fill: #171D25; --k-other: #A7B0BB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141A; --surface: #171D25; --surface-2: #202832;
  --ink: #E6EBF1; --ink-2: #B4BECA; --ink-3: #95A0AD;
  --rule: #2B3440; --rule-2: #435061;
  --accent: #A3B3F4; --accent-2: #232C47; --accent-ink: #0F141A; --stamp: #A3B3F4; --focus: #A3B3F4;
  --run: #E2AD35; --run-ink: #2A1E00; --run-text: #EDC260; --run-tint: #362C12;
  --danger: #F2968D; --danger-solid: #C2372C; --danger-tint: #3B1F1C;
  --neutral: #97A3A4; --marker-fill: #171D25; --k-other: #A7B0BB;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  min-height: 100%; margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
:where(button) { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:where(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea) {
  font: inherit; font-size: 16px; color: var(--ink); background-color: var(--surface);
  border: 1px solid var(--rule-2); border-radius: 9px; padding: 9px 11px; min-height: 44px; width: 100%; min-width: 0;
}
:where(textarea) { resize: vertical; line-height: 1.4; display: block; }
:where(select) {
  appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
:where(input, select, textarea):focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
::placeholder { color: var(--ink-3); opacity: .8; }
input[type="checkbox"] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 750; }
h2 { font-size: 17px; line-height: 1.3; margin: 0; font-weight: 700; }
p { margin: 0; }
section { margin-top: 24px; }

/* ---------- header and tabs ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 16px; min-height: 52px; }
.brand { border: 0; background: none; padding: 6px 0; font-size: 17px; font-weight: 750; letter-spacing: -0.01em; color: var(--ink); cursor: pointer; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex;
  background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1 1 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 58px; border: 0; background: none; color: var(--ink-3); font-size: 12px; font-weight: 600; cursor: pointer;
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.grow { flex: 1 1 auto; }
.save-state { font-size: 13px; color: var(--ink-3); white-space: nowrap; border: 0; background: none; padding: 4px 6px; }
.save-state.warn { color: var(--run-text); font-weight: 650; }
.save-state.err { color: var(--danger); font-weight: 700; cursor: pointer; text-decoration: underline; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.on { color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(100px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
.banner { width: calc(100% - 32px); max-width: 728px; margin: 10px auto 0; padding: 10px 14px; border-radius: 10px; background: var(--run-tint); font-size: 14px; }
.banner.err { background: var(--danger-tint); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
@media (min-width: 820px) {
  .tabbar { position: static; margin-left: 18px; gap: 2px; background: none; border: 0; padding: 0; }
  .tab { flex: none; flex-direction: row; gap: 7px; min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 9px; }
  .tab .i { width: 19px; height: 19px; }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab[aria-current="page"] { background: var(--surface-2); }
  .tab[aria-current="page"]::before { display: none; }
  main { padding-bottom: 64px; }
}

/* ---------- generic ---------- */
.row { display: flex; align-items: center; }
.gap { gap: 8px; }
.wrap { flex-wrap: wrap; }
.end { justify-content: flex-end; }
.center { justify-content: center; margin-top: 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.pad { padding: 18px 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.sep { height: 1px; background: var(--rule); margin: 6px 0; }
.lede { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; max-width: 64ch; }
.warn { color: var(--danger); font-size: 14px; }
.caution { color: var(--run-text); font-size: 14px; }
.small.caution, .caution.small { font-size: 13px; }
.glyph, .i { display: block; flex: none; overflow: visible; }
.chip { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.vh { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
.page-head h1 { margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 2px 0 8px; }
.search {
  display: flex; align-items: center; gap: 4px; flex: 1 1 200px; min-width: 0; padding-left: 10px;
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: 10px; color: var(--ink-3);
}
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search input { border: 0; background: transparent; padding-left: 2px; }
.search input:focus { outline: none; }
.narrow { width: auto; max-width: 100%; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px 2px; max-width: 58ch; }
.empty-title { font-size: 18px; font-weight: 700; }
.empty p { color: var(--ink-2); }
.loading { padding: 12px 0; }
.skel { height: 66px; border-radius: 10px; background: var(--surface-2); margin: 10px 0; }
.crash { max-width: 560px; margin: 48px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* ---------- buttons and inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 15px;
  border: 1px solid var(--rule-2); border-radius: 10px; background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 600; line-height: 1.1; white-space: nowrap; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.run { background: var(--run); border-color: var(--run); color: var(--run-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
.btn.sm { min-height: 38px; padding: 0 11px; font-size: 14px; border-radius: 9px; }
.btn.sm .i { width: 18px; height: 18px; }
.btn.xs { min-height: 34px; padding: 0 9px; font-size: 13px; }
label.btn { position: relative; }
.backlink {
  display: inline-flex; align-items: center; gap: 2px; min-height: 40px; margin: 0 0 4px -8px; padding: 0 10px 0 2px;
  border: 0; border-radius: 8px; background: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer;
}
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.linkish.block { display: block; text-align: left; padding: 1px 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lab { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.field .hint { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.short { max-width: 220px; }
.check { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 14px; line-height: 1.38; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: 1px; }
.check.inline { padding: 0; align-items: center; }
.seg { display: inline-flex; gap: 2px; max-width: 100%; overflow-x: auto; padding: 3px; border-radius: 10px; background: var(--surface-2); }
.seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10, 14, 20, .14); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--rule-2);
  border-radius: 18px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 550; cursor: pointer;
}
.chip-btn:hover { border-color: var(--ink-3); }
.chip-btn.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.unit-in { display: flex; }
.unit-in input { flex: 1 1 auto; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.unit-in select { flex: none; width: auto; border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; background-color: var(--surface-2); }

/* ---------- samples list ---------- */
.samples { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.sample-row {
  display: flex; flex-direction: column; gap: 5px; width: 100%; padding: 14px 6px; border: 0; border-bottom: 1px solid var(--rule);
  background: none; text-align: left; color: inherit; cursor: pointer;
}
.sample-row:hover { background: var(--surface); }
.sr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sr-name { font-size: 21px; font-weight: 750; letter-spacing: -0.015em; word-break: break-word; }
.tpl-name { font-size: 18px; letter-spacing: -0.01em; }
.sr-ago { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.sr-desc { font-size: 15px; color: var(--ink-2); }
.sr-strip { display: flex; align-items: center; gap: 10px; margin-top: 3px; }
.sr-count { font-size: 13px; color: var(--ink-3); }
.sr-next { font-size: 14px; color: var(--ink-2); }
.run-dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--run); vertical-align: 1px; }
.strip { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.cell { display: block; width: 7px; height: 15px; border-radius: 2px; border: 1.5px solid var(--rule-2); background: var(--surface); }
.cell.done { background: var(--c); border-color: var(--c); }
.cell.running { background: var(--run); border-color: var(--run); }
.cell.skipped { background: repeating-linear-gradient(135deg, var(--rule-2) 0 1.5px, transparent 1.5px 4px); }
.cell.kind { border-color: var(--c); background: var(--surface); box-shadow: inset 0 -6px 0 var(--c); }

/* ---------- traveler ---------- */
.sample-head { margin: 2px 0 4px; }
.sh-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sample-id { margin: 0; font-size: 36px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; word-break: break-word; }
.sh-desc { margin-top: 6px; font-size: 16px; color: var(--ink-2); max-width: 62ch; }
.sh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; margin-top: 8px; font-size: 13px; color: var(--ink-3); }
.callout { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-2); }
.steps { list-style: none; margin: 16px 0 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px 24px minmax(0, 1fr) auto; column-gap: 8px; align-items: start; padding: 6px 0; }
.step::before { content: ""; position: absolute; left: 43.25px; top: 0; bottom: 0; width: 1.5px; background: var(--rule-2); }
.step:first-child::before { top: 24px; }
.step:last-child::before { bottom: auto; height: 24px; }
.step:only-child::before { display: none; }
.step.done::before { background: var(--stamp); opacity: .5; }
.st-num { grid-column: 1; padding-top: 14px; text-align: right; font-size: 13px; color: var(--ink-3); }
.st-node { grid-column: 2; position: relative; z-index: 1; display: flex; justify-content: center; padding-top: 14px; }
.st-toggle {
  grid-column: 3; display: flex; flex-direction: column; gap: 2px; min-height: 48px; padding: 10px 0; border: 0;
  background: none; text-align: left; color: inherit; cursor: pointer; min-width: 0;
}
.st-name { font-size: 16px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.step.next .st-name { font-weight: 750; }
.step.skipped .st-name { color: var(--ink-3); text-decoration: line-through; }
.st-sub { font-size: 14px; color: var(--ink-2); word-break: break-word; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-3); }
.st-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 1.5; }
.badge.rate { color: var(--ink); font-variant-numeric: tabular-nums; }
.badge.excl { color: var(--ink-3); text-decoration: line-through; }
.tag { padding: 1px 6px; border-radius: 5px; background: var(--run-tint); color: var(--run-text); font-size: 12px; font-weight: 650; vertical-align: 2px; }
.st-act { grid-column: 4; display: flex; align-items: center; justify-content: flex-end; min-height: 48px; padding-top: 4px; }
.run-act { display: flex; align-items: center; gap: 8px; }
.run-chip { padding: 4px 8px; border-radius: 7px; background: var(--run-tint); color: var(--run-text); font-size: 14px; font-weight: 700; }
.skip-label { padding: 0 4px; color: var(--ink-3); font-size: 13px; }
.stamp {
  display: inline-flex; flex-direction: column; align-items: center; margin: 2px 4px 2px 0; padding: 3px 7px;
  border: 2px solid var(--stamp); border-radius: 6px; color: var(--stamp); line-height: 1.12;
  transform: rotate(-5deg); font-variant-numeric: tabular-nums;
}
.stamp b { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.stamp span { font-size: 12px; font-weight: 600; }
.stamp.fresh { animation: thunk .42s cubic-bezier(.2, 1.5, .35, 1) both; }
@keyframes thunk { 0% { transform: rotate(-16deg) scale(1.8); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotate(-5deg) scale(1); opacity: 1; } }
.st-detail {
  grid-column: 3 / 5; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 16px; margin: 2px 0 10px; padding: 14px;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--surface);
}
.status-panel { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.status-panel.running b { color: var(--run-text); }
.sel-glyph { display: flex; align-items: center; gap: 8px; }
.sel-glyph select { flex: 1; }
.rate-block { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.rate-block .unit-in select { background-color: var(--paper); }
.rate-inputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.rate-out { display: flex; flex-direction: column; gap: 6px; }
.rate-val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.big { font-size: 28px; font-weight: 750; letter-spacing: -0.01em; }
.cmp { color: var(--ink-2); line-height: 1.45; }
.stopwatch { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.sw-time { min-width: 78px; font-size: 20px; font-weight: 700; }
.stopwatch.on .sw-time { color: var(--run-text); }
.meas { display: flex; flex-direction: column; gap: 8px; }
.meas-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, .8fr) 40px; gap: 6px; align-items: center; }
.meas-row .icon-btn { width: 40px; }
.photos { display: flex; flex-direction: column; gap: 8px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.thumb { position: relative; display: block; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface-2); cursor: pointer; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb .cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 4px; overflow: hidden; color: #fff; font-size: 12px;
  text-align: left; white-space: nowrap; text-overflow: ellipsis; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .68));
}
.thumb.loading { display: flex; align-items: center; justify-content: center; cursor: default; }
.file-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 100%; color: var(--ink-2); font-size: 12px; font-weight: 700; }

/* ---------- sheets, menus, toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 12, 18, .5); animation: fade .15s ease-out; }
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100% - 20px - env(safe-area-inset-top, 0px)); overflow: auto;
  padding: 0 18px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 16px 16px 0 0; background: var(--surface);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); outline: none; animation: rise .22s cubic-bezier(.2, .9, .3, 1);
}
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; background: var(--surface); }

.sheet-body { display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) {
  .scrim { align-items: center; padding: 20px; }
  .sheet { border-radius: 16px; max-height: calc(100% - 40px); padding-bottom: 22px; }
}
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
.menu { display: flex; flex-direction: column; }
.menu button {
  display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--rule);
  background: none; color: var(--ink); font-size: 16px; text-align: left; cursor: pointer;
}

.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.lib { display: flex; flex-direction: column; gap: 12px; }
.lib-group { display: flex; flex-direction: column; gap: 6px; }
.lib-head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.pick-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.check.pick { padding: 10px 0; border-bottom: 1px solid var(--rule); color: var(--ink); }
.check.pick > span { display: flex; flex-direction: column; gap: 2px; }
.mono-area { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.toasts {
  position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 12px; max-width: 520px; padding: 8px 8px 8px 16px; border-radius: 12px;
  background: var(--ink); color: var(--paper); font-size: 15px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  pointer-events: auto; animation: rise .2s cubic-bezier(.2, .9, .3, 1);
}
.toast > span { padding: 4px 0; }
.toasts.top { top: calc(58px + env(safe-area-inset-top, 0px)); bottom: auto; }
.lightbox .toast, .toasts.top .toast { border: 1px solid rgba(255, 255, 255, .16); }
.lightbox :focus-visible, .lightbox .lb-cap:focus { outline-color: #A3B3F4; border-color: #A3B3F4; }
.toast.err { background: var(--danger-solid); color: #fff; }
.toast-act { min-height: 38px; padding: 0 10px; border: 0; background: none; color: inherit; font-weight: 750; text-decoration: underline; cursor: pointer; }
@media (min-width: 820px) { .toasts { bottom: 24px; } }

/* ---------- photo viewer ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; background: #0B0E12; color: #fff;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.lb-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 16px; }

.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 48px; height: 64px; border: 0; border-radius: 10px; background: rgba(0, 0, 0, .45); color: #fff; cursor: pointer; }

.icon-btn.light { color: #fff; }

.lightbox .btn { background: #1C222B; border-color: #313B48; color: #fff; }

/* ---------- log ---------- */
.log-tools { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }

  .log-tools .chips::-webkit-scrollbar { display: none; }
  .log-tools .chip-btn { flex: none; }
}
.day { margin-top: 18px; }
.day-head { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 2; padding: 8px 0 6px; border-bottom: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); font-size: 14px; }
.events { list-style: none; margin: 0; padding: 0; }

/* ---------- rates ---------- */
.groups { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }

  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; width: 100%;

}

.group-head h1 { margin: 0; }

.statgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; margin: 16px 0 8px; overflow: hidden; border: 1px solid var(--rule); border-radius: 12px; background: var(--rule); }
.stat { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; background: var(--surface); }

.stat-val { font-size: 27px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.15; }
.stat-val.small-val { font-size: 17px; }
.pm { color: var(--ink-2); font-size: 16px; font-weight: 600; }
.stat-sub { color: var(--ink-2); font-size: 13px; line-height: 1.4; }
.calc { padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }

.calc-in { width: 210px; max-width: 100%; }
.calc-out { display: flex; flex-direction: column; gap: 2px; }

.chart-tools { margin-bottom: 8px; }
.chart-box { width: 100%; max-width: 500px; }
.chart { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 12px; fill: var(--ink); }
.chart text.ax { font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.table-wrap { position: relative; margin-top: 10px; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
table.runs { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px; }
.runs th, .runs td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }

/* ---------- templates, import, settings ---------- */
.tpl-head { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 12px; }

.set-group { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }

@media (prefers-reduced-motion: reduce) {
  .stamp.fresh, .scrim, .sheet, .toast { animation: none; }

}

/* ---------- on-device version ---------- */
.banner.act { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }

.folder-box { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }

/* ---------- countdown timers ---------- */
.run-chip.over { background: var(--danger-tint); color: var(--danger); }
.tmr-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.tmr-big .tnum { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--run-text); }

.tmr-big .small { color: var(--ink-2); }
.timer-in { max-width: 240px; }
.badge .i { width: 13px; height: 13px; }
.timerbar {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 20px));
  bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 6px;
}
.tb-item { display: flex; align-items: center; gap: 6px; padding: 6px; border: 1.5px solid var(--run); border-radius: 14px; background: var(--surface); box-shadow: 0 6px 24px rgba(8, 12, 18, .18); }
.tb-item.over { border-color: var(--danger-solid); background: var(--danger-tint); animation: tbpulse .9s ease-in-out infinite alternate; }
.tb-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 2px 6px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.tb-clock { flex: none; min-width: 4.2ch; font-size: 24px; font-weight: 800; color: var(--run-text); }

.tb-label { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.tb-label b { overflow: hidden; font-size: 15px; white-space: nowrap; text-overflow: ellipsis; }
.tb-label span { overflow: hidden; color: var(--ink-2); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
.tb-btn { flex: none; }
.tb-more { padding: 4px 10px; border-radius: 10px; background: var(--surface); color: var(--ink-2); text-align: center; }
@keyframes tbpulse { from { box-shadow: 0 6px 24px rgba(8, 12, 18, .18); } to { box-shadow: 0 0 0 5px rgba(180, 35, 24, .3); } }
@media (min-width: 820px) { .timerbar { bottom: 16px; } }
body:has(.timerbar) main { padding-bottom: calc(240px + env(safe-area-inset-bottom, 0px)); }
body:has(.timerbar) .toasts { top: calc(58px + env(safe-area-inset-top, 0px)); bottom: auto; }
@media (prefers-reduced-motion: reduce) { .tb-item.over { animation: none; } }

/* ---------- segments ---------- */
.proc-chip { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; background: var(--accent-2); color: var(--accent); font-size: 13px; font-weight: 650; }
.sgm { margin-top: 10px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }

.sgm-head { display: flex; align-items: center; padding-right: 4px; }
.sgm-toggle { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; padding: 12px 4px 12px 12px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.sgm-num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 750; }

.choice { display: flex; flex-direction: column; gap: 8px; }

.pg-name { margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); cursor: pointer; }

/* ---------- AI import ---------- */

.wide { width: 100%; }

/* ---------- travelers, your steps, add step ---------- */

.trow .small { color: var(--ink-3); }
.lib-row { margin-top: 18px; border-top: 1px solid var(--rule); }
.sheet-body .lib-search, .lib-search { flex: none; }
.sec-lab { margin: 12px 0 2px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.lib2 { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.lib-it { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
.lib-it.as-btn { width: 100%; border-left: 0; border-right: 0; border-top: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.lib-it b { display: block; font-size: 15px; }
.lib-it .d { font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.lib-it .src { font-size: 12px; color: var(--ink-3); }
.lib-it .btn, .lib-it .chev { align-self: center; }
/* ---------- drawings ---------- */
.xs-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.xs-top { display: flex; align-items: center; justify-content: space-between; }
.xs-top .lab { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.xs-top .icon-btn { width: 36px; height: 36px; color: var(--accent); }
.xs-svg { padding: 6px 4px 2px; border-radius: 8px; background: var(--surface); }
.xs-svg svg, .xv-draw svg, .tsvg svg { display: block; }
.xs-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.xs-legend span { display: inline-flex; align-items: center; gap: 5px; }
.xs-legend i { width: 12px; height: 12px; border-radius: 2px; border: 0.5px solid rgba(0, 0, 0, .25); }
.xs-legend i.dash { border: 1.5px dashed #D85A30; background: none; }
.xs-op { margin: 0; font-size: 14px; font-style: italic; color: var(--ink); }
.xs-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.checkline { margin: 0; padding: 8px 10px; border-radius: 9px; background: var(--run-tint); color: var(--run-text); font-size: 13px; font-weight: 600; }
.ops-ed { display: flex; flex-direction: column; gap: 6px; }
.ops { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.op { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.op .icon-btn { width: 38px; height: 38px; }
.ops-none { margin: 8px 0; }
.opform { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--accent); border-radius: 12px; background: var(--surface); }
.opform .seg { flex-wrap: wrap; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchips button { min-height: 36px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 18px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.rchips button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.reg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px 40px; gap: 6px; align-items: center; }
.reg-row select { width: auto; }
.reg-row .icon-btn, .lay-row .icon-btn { width: 40px; }
.lay-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 96px auto 40px; gap: 6px; align-items: center; }
.lay-row .sw { width: 14px; height: 14px; border-radius: 3px; border: 0.5px solid rgba(0, 0, 0, .25); }
.unit-tag { display: flex; align-items: center; padding: 0 8px; border: 1px solid var(--rule-2); border-left: 0; border-radius: 0 9px 9px 0; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.nm-in input { min-width: 0; }
@media (max-width: 420px) { .lay-row { grid-template-columns: 14px minmax(0, 1fr) 84px 40px; } .lay-row .check { grid-column: 2 / 4; } }
.xv { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column; background: var(--surface); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.xv-top { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 12px 6px 4px; border-bottom: 1px solid var(--rule); }
.xv-seg { font-size: 13px; color: var(--ink-3); }
.xv-title { font-size: 18px; font-weight: 750; }
.xv-count { font-size: 13px; color: var(--ink-3); }
.xv-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.xv-changes { width: 100%; border-collapse: collapse; font-size: 14px; }
.xv-changes td { padding: 7px 0; border-top: 1px solid var(--rule); }
.xv-film { padding: 8px 0 12px; border-top: 1px solid var(--rule); background: var(--paper); }
.xv-film-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px; color: var(--ink-2); font-size: 13px; font-weight: 650; }
.film { display: flex; gap: 8px; padding: 0 12px; overflow-x: auto; }
.thumb2 { flex: none; display: flex; flex-direction: column; gap: 2px; width: 96px; padding: 6px 6px 5px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: inherit; text-align: left; cursor: pointer; }
.thumb2.on { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.thumb2 .tn { margin-top: 2px; font-size: 12px; font-weight: 650; }
.thumb2 .tc { overflow: hidden; color: var(--ink-3); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.ai-draw { margin-top: 16px; }

/* ---------- compact traveler rows, Now, step page ---------- */
.crows { list-style: none; margin: 0; padding: 0; }
.crow { border-top: 1px solid var(--rule); }
.crows > .crow:first-child { border-top: 0; }
.crow-btn { display: grid; grid-template-columns: 30px 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 48px; padding: 7px 12px 7px 2px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.crow.cur .crow-btn { background: var(--accent-2); }
.crow .cn { font-size: 13px; color: var(--ink-3); text-align: right; }
.crow .cm { min-width: 0; display: flex; flex-direction: column; }
.crow .cm b { font-size: 15px; font-weight: 600; line-height: 1.25; word-break: break-word; }
.crow.skipped .cm b { color: var(--ink-3); text-decoration: line-through; }
.cp { overflow: hidden; color: var(--ink-2); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
.crow .cr { display: flex; align-items: center; }
.mini-stamp { color: var(--stamp); font-size: 12px; font-weight: 750; white-space: nowrap; }
.mini-stamp.fresh { animation: thunk .42s cubic-bezier(.2, 1.5, .35, 1) both; }
.sgm-body > .crows { margin: 0 0 2px; }
ol.crows:not(.in-seg) { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); margin-top: 10px; }
.sgm-body ol.crows { border: 0; border-radius: 0; margin-top: 0; }
.cur-btn { max-width: 100%; margin-top: 10px; justify-content: flex-start; }
.cur-btn span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.now { margin: 4px 0 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); overflow: hidden; }
.now-h { padding: 10px 12px 4px; color: var(--ink-2); font-size: 13px; letter-spacing: .03em; text-transform: uppercase; }
.now-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 52px; padding: 9px 12px; border: 0; border-top: 1px solid var(--rule); background: none; color: inherit; text-align: left; cursor: pointer; }
.now-m { display: flex; flex-direction: column; min-width: 0; }
.now-m b { font-size: 16px; }
.sp { margin: -12px -16px 0; }
.sp-top { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: 4px 4px 0; }
.sp-crumb { overflow: hidden; color: var(--ink-3); font-size: 13px; text-align: center; white-space: nowrap; text-overflow: ellipsis; }
.sp-head { padding: 0 16px 10px; border-bottom: 1px solid var(--rule); }
.sp-head h1 { margin: 0; font-size: 24px; line-height: 1.2; }
.sp-head .meta { margin-top: 2px; color: var(--ink-2); font-size: 14px; }
.sp-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
.sp-nav .linkish { min-height: 32px; overflow: hidden; max-width: 48%; font-size: 13px; text-decoration: none; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-3); }
.sp-next { margin-left: auto; text-align: right; }
.sp-body { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 24px; }
.sp-body .status-panel { padding-bottom: 12px; }
.sp-cond { margin: 0; color: var(--ink-2); font-size: 14px; white-space: pre-wrap; }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; color: var(--ink-2); font-size: 13px; font-weight: 750; letter-spacing: .03em; text-transform: uppercase; }
.sec-n { color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.subs { display: flex; flex-direction: column; }
.sub { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.sub .ck { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 2px solid var(--rule-2); border-radius: 50%; background: var(--surface); color: var(--accent-ink); cursor: pointer; }
.sub .ck .i { width: 16px; height: 16px; }
.sub.done .ck { border-color: var(--stamp); background: var(--stamp); }
.sub.run .ck { border-color: var(--run); background: var(--run-tint); }
.sb-main { display: flex; flex-direction: column; min-width: 0; }
.sb-main b { font-size: 15px; }
.sb-main .p { color: var(--ink-2); font-size: 14px; }
.sub.done .sb-main b, .sub.done .sb-main .p { color: var(--ink-3); }
.sub .tm { color: var(--ink-3); font-size: 13px; text-align: right; white-space: nowrap; }
.tbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 38px; padding: 0 12px; border: 1.5px solid var(--run); border-radius: 19px; background: var(--surface); color: var(--run-text); font-size: 14px; font-weight: 750; cursor: pointer; }
.tbtn .i { width: 14px; height: 14px; }
.runbox { display: flex; flex-direction: column; align-items: flex-end; }
.runbox .big { color: var(--run-text); font-size: 22px; font-weight: 800; line-height: 1; }
.runbox .u { color: var(--run-text); font-size: 12px; }
.sub.over .runbox .big, .sub.over .runbox .u { color: var(--danger); }
.fold { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
.fold-head { display: grid; grid-template-columns: auto minmax(0, 1fr) 18px; gap: 10px; align-items: center; width: 100%; min-height: 48px; padding: 8px 12px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.fold-t { font-size: 15px; font-weight: 600; }
.fold-s { overflow: hidden; color: var(--ink-3); font-size: 13px; text-align: right; white-space: nowrap; text-overflow: ellipsis; }
.fold .chev { display: flex; color: var(--ink-3); }
.fold-b { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px; }
.run-time { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.run-time .field { flex: 1 1 180px; }
.subs-ed { display: flex; flex-direction: column; gap: 8px; }
.sub-ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.sub-ed .sub-timer { max-width: 170px; }
.sub-ed-acts { display: flex; justify-content: flex-end; }
/* pieces */
.pcs { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
.pc-head, .pc-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) repeat(var(--nc, 1), minmax(64px, 84px)); gap: 6px; align-items: center; padding: 6px 8px 6px 4px; }
.pc-head { grid-template-columns: minmax(0, 1fr) repeat(var(--nc, 1), minmax(64px, 84px)); padding-left: 44px; color: var(--ink-2); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--rule); }
.pc-head span:not(:first-child) { text-align: right; }
.pc { border-bottom: 1px solid var(--rule); }
.pc-tog { display: grid; place-items: center; width: 34px; height: 40px; padding: 0; border: 0; background: none; color: var(--ink-3); cursor: pointer; }
.pc-name { min-height: 40px; padding: 6px 8px; font-size: 15px; }
.pc-in { min-height: 40px; padding: 6px 8px; text-align: right; font-size: 15px; }
.pc-val { color: var(--ink); font-size: 15px; text-align: right; }
.pc-val small { display: block; color: var(--ink-3); font-size: 12px; }
.pc-pts { display: flex; flex-direction: column; gap: 6px; padding: 4px 8px 10px 44px; background: var(--surface-2); }
.pt-row { display: grid; grid-template-columns: 20px repeat(var(--nc, 1), minmax(0, 1fr)) 40px; gap: 6px; align-items: center; }
.pt-row input { min-height: 38px; padding: 5px 8px; text-align: right; }
.pt-n { color: var(--ink-3); font-size: 12px; }
.pc-role { min-height: 36px; padding-top: 4px; padding-bottom: 4px; font-size: 14px; }
.pc-acts { padding: 8px; }
.col-in { width: 140px; min-height: 36px; padding: 5px 8px; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 15px; }
.res > span { color: var(--ink-2); font-size: 14px; }
.res b { font-variant-numeric: tabular-nums; }
.calc2 { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--accent); border-radius: 12px; background: var(--surface); }
.calc2-row { align-items: center; flex-wrap: wrap; }
.calc2-in { width: 160px; }
.big4 { font-size: 20px; }

/* ---------- fields each step records ---------- */
:root { --k-plasma: #4E9DA6; --k-inspect: #5E9C6B; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.span2 { grid-column: span 2; }
.fld .lab { color: var(--ink-2); font-size: 13px; font-weight: 650; }
.fin input { min-width: 0; }
.fin input::placeholder { color: var(--ink-3); opacity: 1; }
.fin.chg input { border-color: var(--run); box-shadow: inset 3px 0 0 var(--run); }
.was { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--run-text); font-size: 12px; font-weight: 650; }
.was .linkish { min-height: 28px; font-size: 12px; }
.hintline { color: var(--ink-3); font-size: 12px; }
.fcap { margin: -4px 0 0; }
.fseg { display: flex; flex-wrap: wrap; gap: 6px; }
.fseg button, .fchips button { min-height: 40px; padding: 0 14px; border: 1px solid var(--rule-2); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 650; cursor: pointer; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button { min-height: 36px; border-radius: 18px; font-size: 14px; }
.fseg button.on, .fchips button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.fseg button.plan, .fchips button.plan { border: 2px dashed var(--ink-3); color: var(--ink-2); }
.flds-ed { display: flex; flex-direction: column; gap: 8px; }
.fed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.fed-n { display: flex; flex-direction: column; min-width: 0; }
.fed-n b { font-size: 14px; }
.fed input, .fed select { min-height: 40px; }
.fed-acts { display: flex; }
.fed-acts .icon-btn { width: 36px; height: 36px; }
.fnew { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px; padding: 10px; border: 1px solid var(--accent); border-radius: 10px; }
.fnew .fnew-opts, .fnew > .row { grid-column: 1 / -1; }
.fnew > .row { justify-content: flex-end; }
.typ2 { border-bottom: 1px solid var(--rule); }
.typ-head { display: grid; grid-template-columns: 24px minmax(0, 1fr) 18px; gap: 10px; align-items: center; width: 100%; min-height: 56px; padding: 8px 4px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.typ-m { display: flex; flex-direction: column; min-width: 0; }
.typ-m b { font-size: 16px; }
.typ-m .small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.typ-body { display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 14px 34px; }
.tfrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.8fr) minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.tfrow input, .tfrow select { min-height: 40px; padding-left: 8px; padding-right: 8px; font-size: 14px; }
.tfrow .tf-opts { grid-column: 1 / 4; }
.tfrow .icon-btn { width: 36px; height: 36px; }
@media (max-width: 380px) { .typ-body { padding-left: 4px; } }
.fin input:only-child { border-right: 1px solid var(--rule-2); border-radius: 9px; }
.fin.chg input:only-child { border-color: var(--run); }

</style>

async function boot() {
  const C = LOCAL ? LocalRT : window.claude;
  if (!C || typeof C.use !== 'function') return memoryMode('outside');
  C.use('downloads').then(d => { store.caps.downloads = d || null; bump(); }, () => {});
  C.use('sample').then(s => { store.caps.ask = s || null; bump(); }, () => {});
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { /* treated as absent */ }
  try { id = user ? await user.id() : null; } catch (e) { id = null; }
  if (!db || !id) return memoryMode('nodb');
  base = db.doc('data/users/' + id + '/app');
  store.mode = 'db';
  C.use('assets').then(a => { store.caps.assets = a || null; bump(); }, () => {});
  const first = { samples: false, templates: false, ratelog: false, settings: false };
  const ready = k => {
    if (first[k]) return;
    first[k] = true;
    if (Object.values(first).every(Boolean)) store.loaded = true;
    bump();
  };
  const onErr = k => e => { store.note = describeDbError(e); ready(k); bump(); };
  for (const col of COLS) {
    base.collection(col).onSnapshot(snap => {
      const m = {};
      for (const d of snap.docs) m[d.id] = d.data();
      store.data[col] = m;
      reconcileCol(col);
      ready(col);

    store.settings = d.exists ? d.data() : {};

    bump();
  }, onErr('settings'));

}

function Stopwatch({ sid, st }) {

  const running = !!sw.since;
  const [, tick] = useState(0);
  useEffect(() => { if (!running) return undefined; const t = setInterval(() => tick(x => x + 1), 200); return () => clearInterval(t); }, [running]);
  const ms = (sw.acc || 0) + (running ? Date.now() - sw.since : 0);
  const start = () => updStep(sid, st.id, x => { x.sw = { since: Date.now(), acc: (x.sw && x.sw.acc) || 0 }; });
  const stop = () => updStep(sid, st.id, x => {
    const now = Date.now();
    const acc = ((x.sw && x.sw.acc) || 0) + (x.sw && x.sw.since ? now - x.sw.since : 0);
    x.sw = { since: null, acc };
    x.timeV = swToField(acc, x.timeU);
  });
  return html`<div class=${'stopwatch' + (running ? ' on' : '')}>
    <span class="sw-time tnum" aria-label="Stopwatch">${fmtClock(ms)}${ms < 600000 ? '.' + Math.floor((ms % 1000) / 100) : ''}</span>
    ${running ? html`<button class="btn sm run" onClick=${stop}>${I.pause()}<span>Stop and use time</span></button>`
      : html`<button class="btn sm" onClick=${start}>${I.watch()}<span>${ms ? 'Resume' : 'Start stopwatch'}</span></button>`}
    ${!running && ms ? html`<button class="btn sm ghost" onClick=${() => updStep(sid, st.id, x => { x.sw = null; })}>Reset</button>` : null}
  </div>`;
}

function Lightbox() {

  const move = d => { ui.lightbox = { ...lb, index: (i + d + imgs.length) % imgs.length }; bump(); };
  useEffect(() => {
    const k = e => {
      if (ui.sheet) return;
      if (e.key === 'Escape') close();

  });

      ${imgs.length > 1 ? html`<button class="lb-nav prev" aria-label="Previous" onClick=${() => move(-1)}>${I.left()}</button>` : null}
      ${!isImg ? html`<div class="lb-file">${I.file()}<span>${im.name || 'PDF attachment'}</span></div>`
        : imgSrc(im) ? html`<img src=${imgSrc(im)} alt=${im.cap || 'Step photo'} />`

        : html`<span class="spinner" />`}

    </div>

        onInput=${e => { const v = e.currentTarget.value, id = im.id; updStep(lb.sid, lb.stepId, x => { const t = (x.imgs || []).find(y => y.id === id); if (t) t.cap = v; }, 700); }} />

function detailText(st) {
  const parts = [];
  const tr = [st.tool, st.recipe].filter(Boolean).join(', ');
  if (tr) parts.push(tr);
  if (st.params) parts.push(st.params);
  if ((st.subs || []).length) parts.push(subsLine(st.subs));
  if ((st.fields || []).some(f => f.plan)) parts.push(fieldsLine(st, true));
  if ((st.pieces || []).length) parts.push(`Pieces: ${st.pieces.map(p => p.name).join(', ')}`);
  if (isRateKind(st.kind) && st.timeV) parts.push(`Time ${st.timeV} ${TIME_LABEL[st.timeU] || st.timeU || ''}`.trim());
  if (timerSec(st)) parts.push(`Timer ${fmtSecs(timerSec(st))}`);
  if (realOps(st).length) parts.push(`Drawing: ${realOps(st).map(opText).join('; ')}`);
  return parts.join('. ');
}
const realOps = st => (st.ops || []).filter(o => o.op !== 'none');
const hasDetails = st => !!(st.tool || st.recipe || st.params || st.method || st.material || st.durV || (isRateKind(st.kind) && st.timeV) || realOps(st).length || (st.subs || []).length || (st.pieces || []).length
  || (st.fields || []).some(f => String(f.plan || '') !== '' || String(f.val || '') !== ''));
function saveMyStep(st) {
  if (!String(st.name || '').trim()) { toast('Give the step a name first.', { error: true }); return; }
  const hit = Object.entries(view('steplib')).find(([, p]) => norm(p.name) === norm(st.name));
  put('steplib', hit ? hit[0] : newId('p'), { v: 1, ...pickTpl(st), created: hit ? hit[1].created || Date.now() : Date.now() });

function lastUsedSteps() {
  const best = new Map();
  const consider = (st, t, from) => {
    if (!st || !String(st.name || '').trim() || !hasDetails(st)) return;
    const k = norm(st.name), cur = best.get(k);
    if (!cur || t > cur.t) best.set(k, { st, t, from });
  };
  for (const s of Object.values(view('samples'))) for (const st of s.steps || []) consider(st, st.doneAt || st.startedAt || s.updated || 0, s.name);
  for (const t of Object.values(view('templates'))) for (const st of t.steps || []) consider(st, t.updated || 0, t.name);
  return [...best.values()].sort((a, b) => b.t - a.t);
}

      ${Number.isFinite(sum.within) ? html`<span>Within a piece</span><b>± ${fmtNum(sum.within, 2)} nm (${fmtNum((100 * sum.within) / sum.mean, 2)}%)</b>` : null}
      ${sum.cols.filter(c => Number.isFinite(sum.extra[c].mean)).map(c => html`<span key=${'l' + c}>${c}</span><b key=${'v' + c}>${fmtPm(sum.extra[c].mean, sum.extra[c].sd)}</b>`)}
    </div>
    ${sum.n === 1 ? html`<p class="small muted">One piece, so no spread between pieces${sum.pts > 1 ? '; the ± within a piece is its uniformity' : ''}.</p>`
      : sum.n === 2 ? html`<p class="small caution">With two pieces the spread between pieces is only a rough estimate.</p>` : null}`;
}
function TargetCalc({ sid, s, st }) {
  const r = rateOf(st);
  const [tgt, setTgt] = useState(st.target || '');
  if (!r) return null;
  const T = num(tgt);
  const tf = T > 0 ? timeFor(T, { n: r.nPieces || 1, mean: r.v, sd: Number.isFinite(r.sdRate) ? r.sdRate : 0 }) : null;
  const steps = s.steps || [];
  const k = steps.findIndex(x => x.id === st.id);
  const later = steps.slice(k + 1).filter(x => x.kind === st.kind && x.status !== 'done' && x.status !== 'skipped');
  const nx = later.find(x => norm(x.tool) === norm(st.tool) && norm(x.recipe) === norm(st.recipe)) || later[0];
  const use = () => {
    updStep(sid, nx.id, x => {
      if (r.basis === 'cyc') { x.timeV = String(Math.ceil(tf.t)); x.timeU = 'cyc'; } else { x.timeV = String(+tf.t.toFixed(2)); x.timeU = 'min'; }
      x.timeFromCal = st.id;
    });
    updStep(sid, st.id, x => { x.target = tgt; }, 400);
    toast(`${stepLabel(s, nx)} ${nx.name || 'next step'} set to ${fmtSpan(tf.t, r.basis)}`);
  };
  return html`<div class="calc2">
    <div class="lab">Time for target</div>
    <div class="row gap calc2-row"><span class="unit-in calc2-in"><input inputmode="decimal" aria-label="Target thickness" value=${tgt} placeholder=${st.kind === 'etch' ? 'Depth' : 'Thickness'} onInput=${e => setTgt(e.currentTarget.value)} /><span class="unit-tag">nm</span></span>
      ${tf ? html`<b class="tnum big4">${fmtSpan(tf.t, r.basis)}</b>` : null}</div>
    ${tf && tf.lo != null ? html`<span class="small muted">${fmtSpan(tf.lo, r.basis)} to ${Number.isFinite(tf.hi) ? fmtSpan(tf.hi, r.basis) : 'unbounded'} across ±1σ of this run's rate</span>`
      : tf ? html`<span class="small muted">From a single piece, so there is no spread estimate.</span>` : null}
    ${tf && nx ? html`<button class="btn primary" onClick=${use}>Use ${fmtSpan(tf.t, r.basis)} for ${stepLabel(s, nx)} ${nx.name || 'next step'}</button>` : null}
  </div>`;
}
function RunBlock({ sid, s, st }) {
  const S = getSettings();
  const unit = S.rateUnit, win = Number(S.win) || 0;
  const set = (patch, d = 700) => updStep(sid, st.id, x => Object.assign(x, patch), d);
  const r = rateOf(st);
  let cmp = null;
  if (st.material || st.tool || st.recipe || st.method) {
    const basis = st.timeU === 'cyc' ? 'cyc' : 't';
    const g = rateGroups().find(x => x.key === gkey(st, basis));
    if (g) { const gs = groupStats(g, win, st.run || ('u:' + sid + ':' + st.id)); if (gs.n) cmp = { g, gs, basis }; }
  }
  const cal = st.timeFromCal ? (s.steps || []).find(x => x.id === st.timeFromCal) : null;
  const odd = r && r.basis === 't' && (r.v > 3000 || r.v < 0.01);
  return html`<div class="sec">Run</div>
    <div class="run-time"><${Field} label="Process time"><span class="unit-in">
        <input inputmode="decimal" aria-label="Process time" value=${st.timeV} placeholder="0" onInput=${e => set({ timeV: e.currentTarget.value, timeFromTimer: false, timeFromCal: '' })} />
        <select aria-label="Time unit" value=${st.timeU} onChange=${e => set({ timeU: e.currentTarget.value }, 0)}>${Object.keys(TIME_LABEL).map(u => html`<option value=${u}>${TIME_LABEL[u]}</option>`)}</select></span></${Field}>
      ${st.timeU !== 'cyc' ? html`<${Stopwatch} sid=${sid} st=${st} />` : null}</div>
    ${cal ? html`<p class="small muted">Process time set from the calibration in ${stepLabel(s, cal)} ${cal.name}.</p>` : null}
    ${st.timeFromTimer && st.timeV ? html`<p class="small muted">Process time filled in from the timer. Change it if the actual time differed.</p>` : null}
    <div class="sec">Pieces</div>
    <${PiecesEditor} value=${{ pieces: piecesOf(st), cols: st.cols || [] }} kind=${st.kind}
      onChange=${(v, d) => set({ pieces: v.pieces.map(p => (p.legacy ? { id: newId('pc'), name: p.name, role: p.role, pts: p.pts } : p)), cols: v.cols, thkV: '' }, d)} />
    <${RunResults} x=${st} kind=${st.kind} />
    ${odd ? html`<p class="caution small">This rate is outside the plausible range. Check the time and the thickness units.</p>` : null}
    ${cmp ? html`<p class="small cmp">Recent runs on the same tool and recipe: <b class="tnum">${fmtNum(convRate(cmp.gs.mean, cmp.basis, unit))}${Number.isFinite(cmp.gs.sd) ? ' ± ' + fmtNum(convRate(cmp.gs.sd, cmp.basis, unit), 2) : ''} ${rateUnitLabel(cmp.basis, unit)}</b>
        (n = ${cmp.gs.n})${r && r.basis === cmp.basis ? html`; this run ${pct(r.v, cmp.gs.mean)}${cmp.gs.sd > 0 ? ` (${fmtNum(Math.abs(r.v - cmp.gs.mean) / cmp.gs.sd, 2)}σ)` : ''}` : null}.
        <button class="linkish" onClick=${() => go({ v: 'rate', key: cmp.g.key })}>Rate history</button></p>` : null}
    <${TargetCalc} key=${st.id} sid=${sid} s=${s} st=${st} />
    <label class="check"><input type="checkbox" checked=${!!st.excl} onChange=${e => toggleExcl(sid, st, e.currentTarget.checked)} />
      <span>Leave this run out of rate statistics${st.excl && st.exclWhy ? html`. Reason: <i>${st.exclWhy}</i>` : null}</span></label>`;
}

/* ---------------- sub-steps ---------------- */
const subSec = sb => { const v = num(sb.durV); return Number.isFinite(v) && v > 0 ? Math.round(v * (DUR_F[sb.durU] || 60)) : 0; };
const subKey = (st, sb) => `${st.id}:${sb.id}:${sb.ends}`;
function startSubTimer(sid, st, sb) {
  const sec = subSec(sb);
  if (!sec) return;
  beeper.unlock();
  wake.on();
  const now = Date.now();
  updStep(sid, st.id, x => {
    const y = (x.subs || []).find(z => z.id === sb.id);
    if (!y) return;
    y.start = now; y.ends = now + sec * 1000; y.done = null;
    if (x.status === 'pending') { x.status = 'running'; x.startedAt = now; x.skippedAt = null; x.by = initials() || x.by || ''; }
  });
}
function addSubTimer(sid, st, sb, secs) {
  beeper.unlock();
  if (sb.ends) timerAck.add(subKey(st, sb));
  updStep(sid, st.id, x => { const y = (x.subs || []).find(z => z.id === sb.id); if (y && y.ends) y.ends = Math.max(Date.now(), y.ends) + secs * 1000; });
}
function toggleSub(sid, st, sb) {
  const now = Date.now();
  if (sb.ends && !sb.done) timerAck.add(subKey(st, sb));
  updStep(sid, st.id, x => {
    const y = (x.subs || []).find(z => z.id === sb.id);
    if (!y) return;
    if (y.done) { y.done = null; return; }
    y.done = now;
    if (x.status === 'pending') { x.status = 'running'; x.startedAt = y.start || now; x.skippedAt = null; x.by = initials() || x.by || ''; }
  });
}
function SubRow({ sid, st, sb, now }) {
  const sec = subSec(sb);
  const running = !!sb.ends && !sb.done;
  const left = running ? sb.ends - now : 0;
  return html`<div class=${'sub' + (sb.done ? ' done' : running ? ' run' : '') + (running && left <= 0 ? ' over' : '')}>
    <button class="ck" aria-label=${(sb.done ? 'Uncheck ' : 'Check off ') + (sb.name || 'sub-step')} onClick=${() => toggleSub(sid, st, sb)}>${sb.done ? I.check() : null}</button>
    <span class="sb-main"><b>${sb.name || 'Untitled'}</b>${sb.params ? html`<span class="p">${sb.params}</span>` : null}</span>
    ${sb.done ? html`<span class="tm tnum">${sb.start ? `${fmtTime(sb.start)} to ` : ''}${fmtTime(sb.done)}</span>`
      : running ? html`<span class="runbox"><span class="big tnum">${cdText(left)}</span><span class="u">${left > 0 ? `until ${fmtTime(sb.ends)}` : 'time is up'}</span></span>`
      : sec ? html`<button class="tbtn" aria-label=${`Start ${fmtClock(sec * 1000)} timer for ${sb.name}`} onClick=${() => startSubTimer(sid, st, sb)}>${I.play()}<span class="tnum">${fmtClock(sec * 1000)}</span></button>` : null}
  </div>`;
}
function PlanList({ sid, st }) {
  const subs = st.subs || [];
  const now = useNow(subs.some(x => x.ends && !x.done) ? 250 : 0);
  if (!subs.length) return null;
  const left = subs.filter(x => !x.done).length;
  return html`<div class="sec">Plan<span class="sec-n">${left ? `${left} to go` : 'all checked'}</span></div>
    <div class="subs">${subs.map(sb => html`<${SubRow} key=${sb.id} sid=${sid} st=${st} sb=${sb} now=${now} />`)}</div>
    ${st.status === 'running' && !left ? html`<button class="btn primary wide" onClick=${() => completeStep(sid, st)}>${I.check()}<span>Mark step done</span></button>` : null}`;
}
function SubsEditor({ subs, onChange }) {
  const upd = (i, patch, d = 600) => onChange(subs.map((x, j) => (j === i ? { ...x, ...patch } : x)), d);
  const up = i => { if (i < 1) return; const n = subs.slice(); const [x] = n.splice(i, 1); n.splice(i - 1, 0, x); onChange(n, 0); };
  return html`<div class="subs-ed">
    <div class="lab">Sub-steps</div>
    ${subs.length ? null : html`<p class="small muted">The actions within this step, such as each bath, or each coat and bake, with their parameters and an optional timer.</p>`}
    ${subs.map((x, i) => html`<div class="sub-ed" key=${x.id}>
      <input aria-label=${'Sub-step ' + (i + 1) + ' name'} value=${x.name} placeholder="e.g. Acetone" onInput=${e => upd(i, { name: e.currentTarget.value })} />
      <input aria-label=${'Sub-step ' + (i + 1) + ' parameters'} value=${x.params} placeholder="e.g. sonicate" onInput=${e => upd(i, { params: e.currentTarget.value })} />
      <span class="unit-in sub-timer"><input inputmode="decimal" aria-label=${'Sub-step ' + (i + 1) + ' timer'} value=${x.durV || ''} placeholder="Timer" onInput=${e => upd(i, { durV: e.currentTarget.value })} />
        <select aria-label=${'Sub-step ' + (i + 1) + ' timer unit'} value=${x.durU || 'min'} onChange=${e => upd(i, { durU: e.currentTarget.value }, 0)}>${['s', 'min', 'h'].map(u => html`<option value=${u}>${u}</option>`)}</select></span>
      <span class="sub-ed-acts"><button class="icon-btn" aria-label="Move sub-step up" disabled=${i === 0} onClick=${() => up(i)}>${I.up()}</button>
        <button class="icon-btn" aria-label="Remove sub-step" onClick=${() => onChange(subs.filter((_, j) => j !== i), 0)}>${I.trash()}</button></span>
    </div>`)}
    <div><button class="btn sm ghost" onClick=${() => onChange([...subs, { id: newId('u'), name: '', params: '', durV: '', durU: 'min' }], 0)}>${I.plus()}<span>Sub-step</span></button></div>
  </div>`;
}

/* ---------------- the step page ---------------- */
function Fold({ title, sub, children, open: o0 }) {
  const [o, setO] = useState(!!o0);
  return html`<div class="fold"><button class="fold-head" aria-expanded=${o ? 'true' : 'false'} onClick=${() => setO(!o)}>
      <span class="fold-t">${title}</span><span class="fold-s">${sub || ''}</span><span class="chev">${o ? I.chevD() : I.chevR()}</span></button>
    ${o ? html`<div class="fold-b">${children}</div>` : null}</div>`;
}
function StepPage({ id, step }) {
  const s = view('samples')[id];
  const touch = useRef(null);
  useEffect(() => { window.scrollTo(0, 0); }, [step]);
  if (!s) return html`<${BackLink} label="Samples" /><${Empty} title="This sample is not here"><p>It may have been deleted.</p></${Empty}>`;
  const steps = s.steps || [];
  const k = steps.findIndex(x => x.id === step);
  if (k < 0) return html`<${BackLink} label=${s.name} fallback=${{ v: 'sample', id }} /><${Empty} title="This step is not here"><p>It may have been deleted.</p></${Empty}>`;
  const st = steps[k], prev = steps[k - 1], next = steps[k + 1];
  const g = segOf(s, st);
  const toStep = x => { if (x) go({ v: 'step', id, step: x.id }, true); };
  const onTs = e => { touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTe = e => {
    const t0 = touch.current;
    touch.current = null;
    if (!t0) return;
    const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && !(e.target.closest && e.target.closest('input, textarea, select, .film'))) toStep(dx < 0 ? next : prev);
  };
  const set = (patch, d = 700) => updStep(id, st.id, x => Object.assign(x, patch), d);
  const nImg = (st.imgs || []).length;
  const ops = (st.ops || []).filter(o => o.op !== 'none');
  return html`<div class="sp" onTouchStart=${onTs} onTouchEnd=${onTe}>
    <div class="sp-top"><button class="icon-btn" aria-label="Back to the traveler" onClick=${() => go({ v: 'sample', id, step: st.id }, true)}>${I.back()}</button>
      <span class="sp-crumb">${s.name}${g ? ` · ${g.name}` : ''}</span>
      <button class="icon-btn" aria-label="Edit step" onClick=${() => openStepEdit(id, st.id)}>${I.edit()}</button></div>
    <div class="sp-head">
      <h1>${stepLabel(s, st)} ${st.name || 'Untitled step'}${st.rework ? html` <span class="tag">rework</span>` : null}</h1>
      <div class="meta">${[(KINDS[st.kind] || KINDS.other).label, st.tool, st.recipe].filter(Boolean).join(' · ')}</div>
      <div class="sp-nav">${prev ? html`<button class="linkish sp-prev" onClick=${() => toStep(prev)}>‹ ${stepLabel(s, prev)} ${prev.name}</button>` : html`<span />`}
        ${next ? html`<button class="linkish sp-next" onClick=${() => toStep(next)}>${stepLabel(s, next)} ${next.name} ›</button>` : null}</div>
    </div>
    <div class="sp-body">
      <${StatusPanel} sid=${id} st=${st} />
      ${st.params ? html`<p class="sp-cond">${st.params}</p>` : null}
      <${PlanList} sid=${id} st=${st} />
      <${FieldsBlock} sid=${id} s=${s} st=${st} />
      ${isRateKind(st.kind) ? html`<${RunBlock} sid=${id} s=${s} st=${st} />` : null}
      ${st.kind === 'metrology' ? html`<div class="sec">Measurements</div><${MeasEditor} kind=${st.kind} meas=${st.meas || []} onChange=${(meas, d) => set({ meas }, d)} />` : null}
      <div class="sec">Record</div>
      <${Field} label="Notes"><${AutoText} value=${st.notes} label="Notes" placeholder="Observations, deviations, anything to remember" onInput=${v => set({ notes: v })} /></${Field}>
      ${isRateKind(st.kind) || st.kind === 'metrology' ? null : html`<${Fold} title="Measurements" sub=${(st.meas || []).length ? plural(st.meas.length, 'value') : 'None'}><${MeasEditor} kind=${st.kind} meas=${st.meas || []} onChange=${(meas, d) => set({ meas }, d)} /></${Fold}>`}
      <${Fold} title="Photos" sub=${nImg ? plural(nImg, 'photo') : 'None yet'} open=${nImg > 0}><${Photos} sid=${id} st=${st} /></${Fold}>
      ${drawOf(s) ? html`<${Fold} title="Drawing after this step" sub=${ops.length ? ops.map(opText).join('; ') : 'No change'}><${XsCard} H=${docH(id)} doc=${s} st=${st} /></${Fold}>` : null}

    </div>
  </div>`;
}
function openStepEdit(sid, stepId) { openSheet(() => html`<${StepEditSheet} sid=${sid} stepId=${stepId} />`); }

        <button class="btn ghost sm danger" onClick=${act(() => { deleteStep(sid, st); go({ v: 'sample', id: sid }, true); })}>${I.trash()}<span>Delete step</span></button>

/* ---------------- compact rows and the Now list ---------------- */
const sameDay = t => new Date(t).toDateString() === new Date().toDateString();
const subsLine = subs => subs.map(x => [x.name, x.params].filter(Boolean).join(' ')).filter(Boolean).join(' · ');
function CompactStep({ sid, s, st, i, isNext, label }) {
  const r = isRateKind(st.kind) ? rateOf(st) : null;
  const unit = getSettings().rateUnit;
  const nImg = (st.imgs || []).length;
  const subs = st.subs || [];
  const line = [subs.length ? subsLine(subs) : [[st.tool, st.recipe].filter(Boolean).join(', '), st.params].filter(Boolean).join(' · '), fieldsLine(st)].filter(Boolean).join(' · ');
  const extra = [r ? fmtRate(r.v, r.basis, unit) + (r.nPieces > 1 ? `, ${r.nPieces} pieces` : '') : '', nImg ? plural(nImg, 'photo') : ''].filter(Boolean).join(' · ');
  const rs = subs.find(x => x.ends && !x.done);

  if (st.status === 'done') right = html`<span class=${'mini-stamp' + (ui.fresh.has(st.id) ? ' fresh' : '')}>✓ ${sameDay(st.doneAt) ? fmtTime(st.doneAt) : fmtDate(st.doneAt)}</span>`;
  else if (st.status === 'skipped') right = html`<span class="skip-label">Skipped</span>`;

    : html`<span class="run-chip"><${Elapsed} since=${st.startedAt} /></span>`;
  return html`<li id=${'step-' + st.id} class=${`crow ${st.status}${isNext ? ' cur' : ''}`}>
    <button class="crow-btn" onClick=${() => go({ v: 'step', id: sid, step: st.id })}>
      <span class="cn tnum">${label || i + 1}</span><span class="cg"><${Glyph} kind=${st.kind} state=${st.status} size=${18} label=${(KINDS[st.kind] || KINDS.other).label} /></span>
      <span class="cm"><b>${st.name || 'Untitled step'}${st.rework ? html` <span class="tag">rework</span>` : null}</b>${line || extra ? html`<span class="cp">${[line, extra].filter(Boolean).join(' · ')}</span>` : null}</span>

async function setRunExcl(run, on) {

            <${Field} label="Timer" cls="span2"><span class="unit-in timer-in"><input inputmode="decimal" aria-label="Timer length" value=${st.durV || ''} placeholder="0" onInput=${e => setStep(st.id, { durV: e.currentTarget.value })} />
              <select aria-label="Timer unit" value=${st.durU || 'min'} onChange=${e => setStep(st.id, { durU: e.currentTarget.value }, 0)}>${['s', 'min', 'h'].map(u => html`<option value=${u}>${TIME_LABEL[u] || u}</option>`)}</select></span></${Field}>
          </div>
          <div class="st-foot">
            <button class="btn ghost sm" disabled=${i === 0} onClick=${() => move(i, -1)}>${I.up()}<span>Up</span></button>
            <button class="btn ghost sm" disabled=${i === steps.length - 1} onClick=${() => move(i, 1)}>${I.down()}<span>Down</span></button>
            <button class="btn ghost sm" onClick=${() => openTplAdd(id, i + 1)}>${I.plus()}<span>Insert below</span></button>
            <button class="btn ghost sm danger" onClick=${() => delStep(st.id)}>${I.trash()}<span>Remove</span></button>
          </div></div>` : null}
      </li>`)}</ol>` : html`<${Empty} title="No steps yet"><p>Add the steps of this flow in order.</p></${Empty}>`}
    <div class="row gap after-steps"><button class="btn" onClick=${() => openTplAdd(id)}>${I.plus()}<span>Add step</span></button></div>`;
}

/* ---------------- import ---------------- */
function aiErrText(e) {
  const c = e && e.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) return 'Claude is not available to this page. Use “Split by line” instead.';
  if (c === 'rate_limited') return 'Claude is busy or your usage limit is reached. Try again later.';
  if (c === 'prompt_too_large') return 'That text is too long. Paste the traveler in parts.';
  if (c === 'invalid_json') return 'The reply could not be read as a list of steps. Try again.';
  if (c === 'session_expired') return 'Sign in to claude.ai again, then retry.';
  if (c === 'refused' || c === 'empty_completion') return 'Claude could not convert this text. Try “Split by line”.';
  return 'Could not reach Claude. Try again.';
}
function ImportView({ draft: draft0 }) {
  const job0 = LOCAL && aiState.job && aiState.job.type !== 'draw' ? aiState.job : null;
  const d0 = draft0 || (job0 && job0.draft) || null;
  const [draft] = useState(d0);
  const [text, setText] = useState(() => (job0 && job0.text) || '');
  const [file, setFile] = useState(null);
  const [steps, setSteps] = useState(null);
  const [busy, setBusy] = useState(false);
  const [chars, setChars] = useState(0);
  const [err, setErr] = useState('');
  const [aiOff, setAiOff] = useState(false);
  const [job, setJob] = useState(job0);
  const [usage, setUsage] = useState(null);
  const [sname, setSname] = useState(d0 ? d0.name || '' : '');
  const [proc, setProc] = useState(d0 ? d0.proc || '' : '');
  const isTrav = !!(d0 && d0.target === 'traveler');
  const ctl = useRef(null);
  const now = useNow(job ? 1000 : 0);
  const ask = LOCAL ? null : store.caps.ask;
  const oai = LOCAL && !!aiState.key;
  const S = getSettings();
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const follow = async j => {
    const c = new AbortController();
    ctl.current = c;
    try {
      const r = await pollAiJob(j, { signal: c.signal });
      const rows = parseAiOutput(r);
      const u = await finishAiJob(j, r);
      setUsage(u); setJob(null);
      if (!rows.some(x => x.kind !== 'seg')) setErr('No steps came back. Check that the text is the traveler, then try again.');
      else setSteps(rows);
    } catch (e) {
      if (e && e.code === 'cancelled') return;
      setErr(oaiErrText(e)); setJob(null);
      clearAiJob();
    } finally { if (ctl.current === c) ctl.current = null; }
  };
  useEffect(() => { if (LOCAL && job0) follow(job0); }, []);
  const runOai = async () => {
    if (!text.trim()) return;
    setErr('');
    try {
      const j = await startAiImport(text, { name: sname.trim(), desc: draft ? draft.desc || '' : '', proc: proc.trim(), target: isTrav ? 'traveler' : 'sample' });
      setJob(j);
      follow(j);
    } catch (e) { setErr(oaiErrText(e)); }
  };
  const cancelOai = async () => { if (ctl.current) ctl.current.abort(); const j = job; setJob(null); if (j) await cancelAiJob(j); };
  const runAi = async () => {
    if (!ask || !text.trim()) return;
    setBusy(true); setErr(''); setChars(0);
    const c = new AbortController();
    ctl.current = c;
    try {
      const out = await ask.json(aiPrompt(text), { signal: c.signal, cache: false, onText: ({ text: t }) => setChars(t.length) });
      const cleaned = cleanAiSteps(out);
      if (!cleaned.length) setErr('No steps came back. Check that the pasted text is the traveler, then try again.');
      else setSteps(cleaned.map(x => ({ ...x, id: newId('s'), on: true })));
    } catch (e) {
      if (!(e && e.code === 'cancelled')) {
        setErr(aiErrText(e));
        if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e && e.code)) setAiOff(true);
      }
    } finally { setBusy(false); ctl.current = null; }
  };
  const split = () => { const r = parseTraveler(text); if (!r.length) { setErr('No lines found.'); return; } setErr(''); setUsage(null); setSteps(r.map(x => ({ ...x, id: newId('s'), on: true }))); };
  const onFile = async e => {
    const f = e.currentTarget.files && e.currentTarget.files[0];

    setErr('');
    try {

      setText(r.text); setFile({ name: f.name, summary: r.summary });

    }
    catch (x) { setErr((x && x.message) || 'Could not read that file.'); }

  const upd = (i, patch) => setSteps(steps.map((r, j) => (j === i ? { ...r, ...patch } : r)));
  const save = () => {
    const keep = steps.filter(r => r.on && r.name.trim());
    if (!sname.trim() || !keep.some(r => r.kind !== 'seg')) return;
    const segs = [], out = [];

    for (const r of keep) {
      if (r.kind === 'seg') { cur = { id: newId('g'), name: r.name.trim() }; segs.push(cur); continue; }
      const st = blankStep({ ...pickTpl(r), kind: KINDS[r.kind] ? r.kind : 'other' });
      if (cur) st.seg = cur.id;
      out.push(st);
    }
    if (segs.length && out.some(st => !st.seg)) { const g = { id: newId('g'), name: 'Segment 1' }; segs.unshift(g); for (const st of out) if (!st.seg) st.seg = g.id; }
    if (isTrav) {
      const tid = newId('t');
      put('templates', tid, { v: 2, name: sname.trim(), desc: '', created: Date.now(), ...(segs.length ? { segs } : {}),
        steps: out.map(st => ({ id: st.id, ...pickTpl(st), ...(st.seg ? { seg: st.seg } : {}) })) });

      return;
    }
    const id = newId('x');
    put('samples', id, newSampleDoc({ name: sname.trim(), desc: draft ? draft.desc || '' : '', proc: proc.trim(), steps: out, segs: segs.length ? segs : null }));
    go({ v: 'sample', id }, true);
    toast(`Created ${sname.trim()} with ${plural(out.length, 'step')}${segs.length ? ` in ${plural(segs.length, 'segment')}` : ''}`);
  };
  const nOn = steps ? steps.filter(r => r.on && r.kind !== 'seg').length : 0;
  const nSeg = steps ? steps.filter(r => r.on && r.kind === 'seg').length : 0;
  const nFlag = steps ? steps.filter(r => r.on && r.flag).length : 0;
  const forLine = !isTrav && (sname || (draft && draft.name)) ? html`<p class="small muted imp-for">For new sample <b>${sname || draft.name}</b>${proc ? `, process ${proc}` : ''}.</p>` : null;

    body = html`<div class="work-card"><span class="spinner" /><div><b>${modelLabel(job.model)} is sorting your traveler</b>
